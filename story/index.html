<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игровая сцена — INFERNALIA</title><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#19121d;--panel:#291e2d;--gold:#c7a67b;--cream:#f0e6db;--muted:#bdaab8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 12%,#38283d,#19121d 70%);color:var(--cream);font:21px 'Cormorant Garamond',Georgia,serif}main{max-width:1150px;margin:auto;padding:22px 18px 65px}h1,h2,h3{font-family:'Cinzel Decorative',Georgia,serif}h1{text-align:center;font-size:clamp(25px,4vw,40px);margin:12px 0 4px}.eyebrow{text-align:center;color:var(--gold);letter-spacing:3px;font-size:15px}.sub{text-align:center;color:var(--muted);margin:0 0 24px}.back{display:inline-block;color:var(--gold);text-decoration:none;border:1px solid #856b51;padding:7px 13px}.panel{background:#291e2de8;border:1px solid #96785e;padding:20px;margin:16px 0}.gold{color:var(--gold)}.muted{color:var(--muted)}button,.btn{font:inherit;background:#39283d;border:1px solid #9d805d;color:var(--cream);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{background:#503651;border-color:#e4c395}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{font:inherit;background:#1d1522;border:1px solid #8d715b;color:var(--cream);padding:10px;width:100%;border-radius:0}textarea{resize:vertical}label{display:block;color:var(--gold);margin:13px 0 5px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.tile{background:#291e2d;border:1px solid #755c67;padding:9px;text-align:center;cursor:pointer}.tile.active{border-color:#f1d1a2;box-shadow:0 0 0 1px #f1d1a2}.tile img{height:170px;width:100%;object-fit:cover;object-position:top}.tile span{display:block;margin-top:5px;font-size:17px}.hidden{display:none!important}.frame{border:1px solid #c7a67b;background:#211924;padding:20px;box-shadow:0 0 0 4px #271d2b,0 0 0 5px #795f51}.portrait{width:100%;height:300px;object-fit:contain;background:#1a131e}.fade{animation:appear .42s ease both}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:680px){.portrait{height:230px}.panel{padding:14px}main{padding:14px 12px 40px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style></head><body><main><a class="back" href="../index.html">← Главное меню</a><div class="eyebrow">✦ INFERNALIA ✦</div><h1 id="chapter">Новая судьба</h1><p class="sub" id="subtitle"></p><div class="actions" style="justify-content:center"><button id="historyButton">☷ Летопись</button><button id="saveButton">◇ Сохранить</button><button id="settingsButton">⚙ Отображение</button><button id="regenButton">↻ Другой вариант</button></div><div id="settings" class="panel hidden"><label><input type="checkbox" id="showPortrait" checked style="width:auto"> Показывать портрет</label><label><input type="checkbox" id="animate" checked style="width:auto"> Плавное появление текста</label></div><div id="stage" class="panel"><div id="portraitWrap" style="text-align:center;margin-bottom:20px"><img id="heroPortrait" class="portrait" alt="Портрет выбранного героя"><div id="heroName" class="gold"></div></div><div class="frame"><div class="gold" id="speaker"></div><div id="line" style="font-size:clamp(23px,2.7vw,30px);min-height:110px;line-height:1.3;margin:12px 0"></div><div class="actions" style="justify-content:space-between;align-items:center"><button id="prev">← Назад</button><span id="counter" class="muted"></span><button id="next">Далее →</button></div></div><div id="turn" class="panel hidden"><h2 style="font-size:23px">Ваш ход</h2><textarea id="action" rows="4" placeholder="Что скажет или сделает ваш персонаж?"></textarea><div class="actions"><button id="send">Добавить действие · демо</button><button id="edit">Изменить последнее действие</button></div><p class="muted">Подключение API пока не реализовано. Действие сохраняется локально, но ответ ИИ не генерируется.</p></div></div><div id="history" class="panel hidden"><h2>Летопись событий</h2><div id="historyList"></div><button id="closeHistory">Вернуться к сцене</button></div><p class="sub">Прототип интерфейса · примеры сцен не являются каноном</p></main><script>const $=id=>document.getElementById(id);let save;try{save=JSON.parse(localStorage.getItem('infernalia_demo_save')||'null')}catch{}if(!save)location.replace('../select/index.html');let chars=[];try{chars=JSON.parse(localStorage.getItem('infernalia_custom_characters')||'[]')}catch{}const custom=chars.find(c=>c.id===save?.customId);$('subtitle').textContent=(save?.characterName||'Персонаж')+(custom?' · '+custom.name:'');$('chapter').textContent=save.mode==='lore'?'Сказания преисподней · демо':'Новая судьба';fetch('../characters/characters.json').then(r=>r.json()).then(list=>{const hero=list.find(c=>c.id===save.characterId);if(hero?.image){$('heroPortrait').src=('../characters/'+hero.image.replace(/^\.\.\//,''));$('heroPortrait').onerror=()=>$('heroPortrait').style.display='none'}else $('heroPortrait').style.display='none';$('heroName').textContent=save.characterName||''}).catch(()=>{$('heroPortrait').style.display='none';$('heroName').textContent=save.characterName||''});const initial=save.mode==='pen'&&save.opening?save.opening:'Вступление будет создано ИИ после подключения API. Пока это демонстрационный экран новеллы.';let turns=Array.isArray(save.turns)?save.turns:[{speaker:'Повествование',text:initial},{speaker:save.characterName||'Персонаж',text:'Демонстрационная реплика. Настоящие диалоги появятся после подключения выбранного игроком API.'}];let parts=[],index=0;function split(t){const paras=t.split(/\n\s*\n/).filter(Boolean),result=[];for(const para of paras){if(para.length<360){result.push(para);continue}const sentences=para.match(/[^.!?…]+[.!?…]+(?:[»”"']*)|[^.!?…]+$/g)||[para];let acc='';for(const sent of sentences){if(acc.length+sent.length>330&&acc){result.push(acc.trim());acc=''}acc+=sent}if(acc.trim())result.push(acc.trim())}return result.length?result:['']}function build(){parts=turns.flatMap((t,turnIndex)=>split(t.text).map(text=>({speaker:t.speaker,text,turnIndex})));index=Math.min(index,parts.length-1)}function draw(){build();const p=parts[index];$('speaker').textContent=p.speaker;$('line').textContent=p.text;$('line').className=$('animate').checked?'fade':'';$('counter').textContent=(index+1)+' / '+parts.length;$('prev').disabled=index===0;$('next').style.display=index===parts.length-1?'none':'';$('turn').classList.toggle('hidden',index!==parts.length-1);$('edit').disabled=!turns.some(t=>t.speaker==='Ваш персонаж');$('regenButton').disabled=true;renderHistory()}function renderHistory(){const holder=$('historyList');holder.replaceChildren();for(const t of turns){const box=document.createElement('div');box.className='panel';const label=document.createElement('div');label.className='gold';label.textContent=t.speaker;const text=document.createElement('p');text.textContent=t.text;box.append(label,text);holder.append(box)}}$('prev').onclick=()=>{if(index>0){index--;draw()}};$('next').onclick=()=>{if(index<parts.length-1){index++;draw()}};$('historyButton').onclick=()=>{$('history').classList.remove('hidden');$('stage').classList.add('hidden')};$('closeHistory').onclick=()=>{$('history').classList.add('hidden');$('stage').classList.remove('hidden')};$('settingsButton').onclick=()=>$('settings').classList.toggle('hidden');$('showPortrait').onchange=e=>$('portraitWrap').classList.toggle('hidden',!e.target.checked);$('animate').onchange=draw;function persist(){save.turns=turns;localStorage.setItem('infernalia_demo_save',JSON.stringify(save))}$('saveButton').onclick=()=>{persist();alert('Демонстрационное прохождение сохранено в браузере.')};$('send').onclick=()=>{const t=$('action').value.trim();if(!t)return;turns.push({speaker:'Ваш персонаж',text:t});$('action').value='';index=999;persist();draw()};$('edit').onclick=()=>{const last=turns.map((t,i)=>[t,i]).filter(x=>x[0].speaker==='Ваш персонаж').pop();if(!last)return;$('action').value=last[0].text;turns=turns.slice(0,last[1]);index=999;persist();draw()};draw();</script></body></html>
