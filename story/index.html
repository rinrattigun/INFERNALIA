<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сцена — INFERNALIA</title><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--gold:#c7a67b;--cream:#f0e6db;--muted:#bdaab8;--line:#81674f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(ellipse at 50% 15%,#3b293e,#1d1520 65%,#100c13);font-family:'Cormorant Garamond',Georgia,serif;font-size:21px}
h1,h2{font-family:'Cinzel Decorative',Georgia,serif}h1{font-size:clamp(27px,4vw,44px);margin:8px 0 4px}h2{font-size:25px}
main{max-width:1140px;margin:auto;padding:25px 22px 55px}.top{text-align:center}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:15px}.muted{color:var(--muted)}a{color:var(--gold)}button{cursor:pointer;font:inherit;color:var(--cream);background:#302331;border:1px solid #94785e;padding:9px 18px}button:hover:not(:disabled),button:focus-visible{border-color:#f1d5a8;background:#49344a;outline:0}button:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;border:1px solid #81674f;padding:7px 15px;margin-bottom:10px}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:17px auto 25px;max-width:700px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.tile{padding:8px;background:#281e2b;border:1px solid #72596a;display:flex;flex-direction:column;gap:7px;align-items:stretch;text-align:center}.tile.active{border-color:#e6c89c;box-shadow:0 0 15px #c8a37e44}.tile img,.tile .blank{width:100%;height:180px;object-fit:cover;object-position:top;background:#1a1420}.tile .blank{display:grid;place-items:center;color:#bdaab8;font-size:35px}.tile span{font-size:18px;line-height:1.1;min-height:40px}.group{margin:25px 0 10px;color:var(--gold);font-size:24px}.detail{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:25px;background:#271d2b;border:1px solid #876d59;padding:20px;margin-top:25px}.detail img,.detail .blank{width:100%;height:350px;object-fit:contain;background:#18131d}.detail .blank{display:grid;place-items:center;color:var(--muted)}.detail h2{margin:4px 0}.detail p{line-height:1.35}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.note{font-size:17px;color:var(--muted)}@media(max-width:640px){.detail{grid-template-columns:1fr}.detail img,.detail .blank{height:280px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stage{position:relative;min-height:65vh;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(ellipse at 50% 30%,#3d2a42,#1a1420 65%);border:1px solid #876d59;padding:25px;overflow:hidden}.frame{background:#201924ed;border:1px solid #b99a73;padding:22px;box-shadow:0 0 0 5px #241a28,0 0 0 6px #755d50}.speaker{color:var(--gold);font-size:24px}.dialogue{font-size:27px;min-height:80px;line-height:1.3}.scene-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.demo{color:#d8bd9c;text-align:center;position:absolute;top:30%;left:10%;right:10%;font-size:24px}.choice{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:10px}.choice button{border-color:#c7a67b}
</style></head><body><main><a class="back" href="../index.html">← Главное меню</a><header class="top"><div class="eyebrow">✦ INFERNALIA ✦</div><h1>Демонстрация новеллы</h1></header><div class="rule"></div><section class="stage"><div class="demo">✦ Здесь будет фоновая иллюстрация сцены ✦</div><div class="frame"><div class="speaker" id="speaker"></div><div class="dialogue" id="line"></div><div id="choices" class="choice" hidden></div><div class="scene-controls"><span class="note">Демо интерфейса · не канонический сюжет</span><button id="next">Далее →</button></div></div></section></main><script>
const saved=JSON.parse(localStorage.getItem('infernalia_demo_save')||'null');if(!saved)location.replace('../select/index.html');
const speaker=document.getElementById('speaker'),line=document.getElementById('line'),next=document.getElementById('next'),choices=document.getElementById('choices');let step=0;
const scenes=[['Повествование','Здесь начнётся история выбранного персонажа.'],[saved?.characterName||'Персонаж','Это демонстрация диалогового окна. Позже здесь появится настоящий текст из сценария.'],['Повествование','А теперь — пример выбора в золотой рамке.']];
function draw(){const s=scenes[Math.min(step,2)];speaker.textContent=s[0];line.textContent=s[1];choices.hidden=step!==3;next.hidden=step===3;if(step===3){speaker.textContent='Выбор';line.textContent='Как поступить?';choices.innerHTML='';['Продолжить знакомство','Вернуться к выбору героя'].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(i===1)location.href='../select/index.html';else{step=0;draw()}};choices.append(b)})}}
next.onclick=()=>{step++;draw()};draw();
</script></body></html>
