<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INFERNALIA · Гримуар</title><style>
:root{color-scheme:dark;--gold:#cba77a;--cream:#f1dfc5;--plum:#1b121e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#362332,#130e16 80%);color:var(--cream);font-family:Georgia,serif;min-height:100vh}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.nav{padding:25px 18px;border-right:1px solid #7c5b51;background:#1b121ddc;overflow:auto}.brand{font-size:25px;letter-spacing:2px;color:#e4c49d;margin-bottom:6px}.sub{font-size:11px;letter-spacing:2px;color:#b99b8e;margin-bottom:28px}.group{font-size:12px;letter-spacing:3px;color:#cba77a;margin:25px 8px 8px}.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #4a333b;color:#e4d1bf;padding:10px 8px;cursor:pointer;font-family:inherit;font-size:15px}.item:hover,.item.active{color:#ffe4b6;background:#51303b88}.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px 24px;min-width:0}.top{width:min(1100px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#cda987}.book{width:min(1100px,100%);min-height:610px;display:grid;grid-template-columns:1fr 1fr;background:#d8bca0;box-shadow:0 20px 65px #000a,0 0 0 8px #482c33,0 0 0 10px #b58a62;border-radius:8px;overflow:hidden}.page{color:#34222a;background:linear-gradient(90deg,#c7a88c 0%,#ead4b6 7%,#eedec6 95%,#d6b89d 100%);padding:45px 42px;min-width:0;position:relative}.page.right{background:linear-gradient(90deg,#d3b296 0%,#efdec6 7%,#ecd4b7 96%,#caa78c 100%);border-left:2px solid #8f6e64}.page:before{content:"✦ ───────────── ✦";display:block;text-align:center;color:#9b6b53;font-size:14px;margin-bottom:16px}.page h1{font-size:30px;text-align:center;font-weight:normal;margin:0 0 22px}.content{font-size:17px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}.content p{margin:0 0 14px}.content table{border-collapse:collapse;width:100%;font-size:12px}.content td,.content th{border:1px solid #a78375;padding:5px}.empty{border:1px dashed #b99a82;text-align:center;padding:45px 10px;color:#977760;margin:25px 0}.controls{display:flex;align-items:center;gap:20px;margin-top:22px}.controls button,.back{background:#2b1a25;color:#e5c49b;border:1px solid #ad8467;padding:10px 20px;cursor:pointer;font:inherit}.controls button:hover,.back:hover{background:#4b2b3b}.small{font-size:12px;color:#ad907e}.mobileNav{display:none}@media(max-width:850px){.app{display:block}.nav{display:none}.stage{padding:15px}.mobileNav{display:block;width:100%;padding:10px;background:#2b1a25;color:#ecd2b4;border:1px solid #ac866e;margin-bottom:15px}.book{display:block;min-height:0}.page{padding:28px 25px;min-height:360px}.page.right{border-left:0;border-top:2px solid #8f6e64}.content{font-size:16px}.page h1{font-size:24px}}
</style></head><body><a href="../index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:#211923;color:#e9d8c6;border:1px solid #b49a75;padding:8px 14px;text-decoration:none">← Главное меню</a><div class="app"><aside class="nav"><div class="brand">INFERNALIA</div><div class="sub">СКАЗАНИЯ ПРЕИСПОДНЕЙ</div><div id="nav"></div></aside><main class="stage"><select class="mobileNav" id="mobileNav" aria-label="Выбрать главу"></select><div class="top"><span>✦ ГРИМУАР ✦</span><span id="sectionName"></span></div><div class="book"><article class="page"><h1 id="leftTitle"></h1><div id="left" class="content"></div></article><article class="page right"><h1 id="rightTitle"></h1><div id="right" class="content"></div></article></div><div class="controls"><button id="prev">❮ Назад</button><span id="counter"></span><button id="next">Вперёд ❯</button></div><p class="small">Исходный текст из «ЛОР.docx». Иллюстрации будут добавлены позднее.</p></main></div><script id="data" type="application/json">{"title": "INFERNALIA — Сказания преисподней", "source": "ЛОР_оформленный_исправленный.docx", "status": "Материал из предоставленного исправленного файла; без авторских дополнений", "groups": ["Мир", "Персонажи", "Сюжет"], "sections": [{"id": "entry_1", "title": "Предисловие", "group": "Мир", "kind": "lore", "source_range": [80, 115], "paragraphs": [{"source_paragraph": 95, "text": "–  Вас предала ваша семья и охотиться странный дух, который помешан на вас и хочет сделать вас его женой, то вы попали туда куда надо - в АД! Именно, поэтому Сора тут в клоаке совсем другого мира, где правят не духовность и благородие, а семь смертных грехов."}, {"source_paragraph": 96, "text": "– Вы работаете в борделе, привыкший к роскоши и вниманию женщин, но появляется тут эта дикая ободранная штучка и в итоге ба-бах у вас семья, дети и вы даже не ссоритесь из-за всего. Ну возможно.… Да ладно, я вру, у них полная идиллия! Они идеальная пара! И мы поведаем вам историю о них!"}], "illustration": null}, {"id": "entry_2", "title": "Семь кругов Ада", "group": "Мир", "kind": "lore", "source_range": [131, 137], "paragraphs": [{"source_paragraph": 131, "text": "Глава I"}, {"source_paragraph": 133, "text": "Устройство Ада."}, {"source_paragraph": 134, "text": "7 Смертных Грехов и 7 Кругов Ада."}, {"source_paragraph": 136, "text": "Семь кругов Ада."}, {"source_paragraph": 137, "text": "Ад разделен на семь территориальных кругов, каждый из которых соответствует одному из 7 смертных грехов. Управляют кругами высшие демоны - Владыки, воплощающие суть своего греха."}], "illustration": null}, {"id": "entry_3", "title": "Статусы кругов", "group": "Мир", "kind": "lore", "source_range": [138, 140], "paragraphs": [{"source_paragraph": 138, "text": "Иерархия и статусы Кругов."}], "illustration": null, "table": [["Круг", "Грех", "Статус", "Владыка", "Примечание"], ["Гордыня", "Гордость", "Правящий", "Люцифер Морнингстар", "Самый влиятельный Круг. Центр власти"], ["Похоть", "Похоть", "Независим", "Лиа Фаврис", "Сопротивление"], ["Чревоугодие", "Обжорство", "Независим", "Бельфегор Иггиро", "Сохраняет нейтральные позиции"], ["Зависть", "Зависть", "Нейтралитет", "-", "Территория грешников"], ["Алчность", "Алчность", "Нейтралитет", "-", "-"], ["Гнев", "Гнев", "Захвачен", "Бритни", "Круг пал под натиском армии Люцифера"], ["Лень", "Уныние", "Падший", "Октавия", "Обращен в камень Владыкой Лени"]]}, {"id": "entry_4", "title": "Владыки Ада", "group": "Мир", "kind": "lore", "source_range": [141, 148], "paragraphs": [{"source_paragraph": 141, "text": "Владыки Ада:"}, {"source_paragraph": 142, "text": "Люцифер Денница Морнингстар Магнум. Грех – Гордость. Титул – Верховный Владыка Ада, Владыка Круга Гордыни."}, {"source_paragraph": 143, "text": "Лиа Асмодей Фаврис. Грех – Похоть. Титул – Владыка Круга Похоти, Смертный грех Похоти."}, {"source_paragraph": 144, "text": "Асмодей Первантен. Бывший Владыка Круга Пхоти. Пал в битве с Лиа Фаврис."}, {"source_paragraph": 145, "text": "Октавия Аббадон Саднесс. Грех – Уныние. Титул – Бывший Владыка Круга Лени."}, {"source_paragraph": 146, "text": "Бритни Иерофант Праудрайд. Грех – Гнев. Титул – Бывшая Владыка круга Гнева, Круг пал в битве с верховными."}, {"source_paragraph": 147, "text": "Бельфегор Иггиро. Грех – обжорство. Титул – Владыка Круга Чревоугодия."}], "illustration": null}, {"id": "entry_5", "title": "Иерархия демонов", "group": "Мир", "kind": "lore", "source_range": [149, 155], "paragraphs": [{"source_paragraph": 149, "text": "Иерархия."}, {"source_paragraph": 150, "text": "Архидемоны. Высшая каста демонов. Правители, верховные демоны, стоящие на верхушке пищевой цепи. Они воплощают смертный грех, законы, политическую волю круга. Архидемоны могут являться чистокровными наследниками престола по праву крови. Могут определяться по принципу завоевания титула и принятия чужого греха, будучи рожденными обычными демонами. Наследование статуса так же является способом передачи власти, если Владыка не имел собственных наследников. Архидемоны управляют кругами, участвуют в Совете Владык, неподсудны низшим судам, могут заключать браки с другими высшими длемонами, имеют право в вопросах войны и мира."}, {"source_paragraph": 151, "text": "Демоны. Основное население Ада, занимающее должности, имеющие доступ к политике, экономике и культуре. Демоны делятся на разные виды и расы: Кицунэ, бакэнэко/некомата, суккубы/инкубы, тролли, полтергейсты, минотавры, ину и т.д. Обычный демон может занимать управленческую роль, владеть бизнесом, служить в войсках, администрации, имеет право голоса в местных советах, может подниматься по карьерной лестнице или попробовать завоевать титул архидемона."}, {"source_paragraph": 152, "text": "Бесы, импы. Низшие жители. Рабочая сила Ада. Бесы – это демоны, не обладающие достаточной силой, родословной, богатством, чтобы подняться выше. Их права и возможности сильно ограничены. Происходят из бедных семей и населяют трущобы. Редко имеют доступ к образованию. Часто работают курьерами, почтальонами, грузчиками, прислугой и т.д. Не имеют право голоса, не имеют доступа к верхним светским кругам."}, {"source_paragraph": 153, "text": "Грешники. Люди, попавшие в ад, за совершенные грехи. Низший класс, чьи души являются ресурсами. Не имеют прав, могут использоваться как бесплатная рабочая сила, рабы, шуты, жертвы. Если высший проявит милость, могут стать прислугой."}, {"source_paragraph": 154, "text": "Хтонь или падшие. Грешники, близкие к распаду искры. Это грешники, сломавшиеся морально или физически, утратившие личность, превратившиеся в существ. Бесы, сожранные скверной или доведенные до отчаяния. Демоны, лишенные статуса или изгнанные в Бездну. Практически безмозглые, движимые инстинктами. В основном – голодом, агрессией и страхом. Опасны для всех, включая друг друга. Обитают в Бездне, необитаемых районах, пустошах, заброшках, канализациях. В большинстве случаев – уродливые твари."}], "illustration": null}, {"id": "entry_6", "title": "Скверна и семь её типов", "group": "Мир", "kind": "lore", "source_range": [156, 167], "paragraphs": [{"source_paragraph": 156, "text": "Скверна – система способностей демонов."}, {"source_paragraph": 157, "text": "Скверна – магическая первородная энергия, присущая в основном архидемонам и их наследникам. Она является одновременно: источником жизненной силы, проявлением греха, проклятием. Каждый тип скверны связан с присущим демону грехом, имеет свою природу, слабости и цену."}, {"source_paragraph": 158, "text": "Типы скверны:"}, {"source_paragraph": 159, "text": "Похоть – скверна желания. Эмоциональная, чувственная, манипулятивная. Обладатели скверны способны чувствовать желания, сексуальные мысли, читать эмоции и влиять на них. Способны усиливать или подавлять страсть. Чаще свойственны инкубам и суккубам, реже другим видам. Работает только на живым разумных существах, может быть подавлена сильной волей. Риски: потеря контроля из-за обилия ощущений, потеря личности."}, {"source_paragraph": 160, "text": "Гнев – скверна ярости. Физическая, волевая, подавляющая. Подчиняет чужую волю через страх, внушает ужас, усиливает физическую мощь до номинальных пределов. Чем сильнее носитель – тем мощнее его скверна. В бою способны терять контроль. Слабеет против хладнокровных противников. Постепенно разрушает личность носителя, делает его агрессивным и непредсказуемым, без необходимого контроля."}, {"source_paragraph": 161, "text": "Гордыня – скверна превосходства. Эгоцентрическая, усиливающая, трансцендентная. Возвышает собственные силы по щелчку, подавляет волю других, получает колоссальную физическую и магическую мощь за счет убежденности в собственном превосходстве. Чем выше самооценка носителя – тем сильнее скверна. Работает только пока носитель верит в свое превосходство, малейшее сомнение и сила падает. Полная потеря объективной оценки личности, носитель перестает видеть угрозы."}, {"source_paragraph": 162, "text": "Лень или уныние – скверна апатии. Психологическая, усыпляющая, разрушающая волю. Усыпляет разум, погружает в вечный сон, высасывает силы и самообладание, вызывает апатию, бессонницу, способна контролировать сновидения и влиять на разум. Скрытная и очень опасная. Противник может даже не заметить атаки на разум. Не работает против существа без разума, или с сильной волей, требует длительного воздействия. Носитель сам становится апатичным, вечно физически ослабленным, теряет способность спать и отличать сон от яви."}, {"source_paragraph": 163, "text": "Чревоугодие – скверна пожирания. Разрушительная, конфликтогенная, пожирающая. Сталкивает между собой существ. Способна заставить убивать друг друга до полного истощения, усиливает агрессию, голод, пожирает чужие силы. Чем больше вокруг существ, чьи силы можно сожрать – тем сильнее носитель. Непобедима в битвах с армиями. Плохо работает против одиночных целей. Носитель всегда голоден, как физически, так и энергетически."}, {"source_paragraph": 164, "text": "Алчность – скверна присвоения. Накопительная, паразитическая. Способна забрать чужую способность, присвоив ее носителю, включая воспоминания. Работает как генератор, чем больше присвоено – тем сильнее носитель. Требует прямого контакта, либо длительного воздействия, присвоенная сила может быть отторгнута. Носитель может потерять собственную идентичность."}, {"source_paragraph": 165, "text": "Зависть – скверна паранойи. Наблюдательная, аналитическая, параноидальная. Предвидит чужие действия, мысли и слабости. Позволяет предугадывать ход мыслей и действий противника. Не дает прямой физической мощи, уязвима против физически и морально сильного противника. Постоянное ощущение того, что за тобой следят сводит носителя с ума, приводят к паранойе."}, {"source_paragraph": 166, "text": "Скверны способны конкурировать и подавлять, усиливать друг друга, если два архидемона работают в союзе,  противодействовать, смешиваться, что характерно для демонов гибридов."}], "illustration": null}, {"id": "entry_7", "title": "Искра демона", "group": "Мир", "kind": "lore", "source_range": [168, 173], "paragraphs": [{"source_paragraph": 168, "text": "Искра – сердце и душа демона."}, {"source_paragraph": 170, "text": "Искра – сущностное ядро, объединяющее функции сердца и души. Это источник жизни, воли, эмоций и магии. Уничтожение искры приводит к смерти демона. Погасить искру может другой демон с превосходящей силой, либо архангел."}, {"source_paragraph": 172, "text": "У каждой искры собственный цвет, определяющий цвет скверны. Цвет отражает уникальный характер греха, тип скверны и личность носителя. Искра не бьется. Как человеческое сердце, но можно почувствовать легкие вибрации. В редких случаях искру можно передать другому."}], "illustration": null}, {"id": "entry_8", "title": "Исключения и аномалии", "group": "Мир", "kind": "lore", "source_range": [174, 188], "paragraphs": [{"source_paragraph": 174, "text": "Исключения."}, {"source_paragraph": 175, "text": "В Аду есть демоны не вписывающиеся в стандартные рамки."}, {"source_paragraph": 176, "text": "Архидемоны без скверны – Каин Люцифер Магнум. Имеет ограниченные демонические способности, не обладает магической силой. Такие либо рождаются сразу с дефектом, либо подавляют скверну осознанно. Считаются слабыми и непригодными для правления."}, {"source_paragraph": 178, "text": "Демоны целители."}, {"source_paragraph": 179, "text": "Помимо основной скверны, способны использовать магию исцеления. Редкий дар среди демонов. Как правило присущий духам или божествам. Считается аномальной, не изучена."}, {"source_paragraph": 181, "text": "Бесы с большой духовной силой."}, {"source_paragraph": 182, "text": "Обладают нехарактерной сильной искрой для своего класса. Предположительно атавизм или результат редкой мутации. Искра ощущается ярче, чем у обычных бесов."}, {"source_paragraph": 183, "text": "Демон с двойной природной скверной, гибриды."}, {"source_paragraph": 184, "text": "Гибриды разных видов иногда наследуют сразу два типа скверны. Эта магия непредсказуема и редка, дает возможность использовать скверну и духовную силу. Считается уникальной и порождает различные способности, например. Близняшка-чертовка. Очень ценны и опасны."}, {"source_paragraph": 186, "text": "Чрезмерная духовная сила и скверна."}, {"source_paragraph": 187, "text": "При особо мощной сквере и силы искры, происходит мощнейший синтез в теле демона. Такие способны сравниться с верховным Владыкой и даже одержать победу. Нюанс: демоны с такой аномалией либо не выживают, либо крайне опасны для себя и других демонов, кругов, миров. Любой эмоциональный или физический сбой способен вызывать всплеск неконтролируемой мощи, способный уничтожить буквально все вокруг себя. Подобная сила сильно истощает носителя физически."}], "illustration": null}, {"id": "entry_9", "title": "Поднебесная и архангелы", "group": "Мир", "kind": "lore", "source_range": [189, 203], "paragraphs": [{"source_paragraph": 189, "text": "Примечание. Антипод Ада. Зеркало преисподней – Поднебесная."}, {"source_paragraph": 190, "text": "Или как все привыкли – Рай. Так же известна как Небесное Царство, Эмпирей."}, {"source_paragraph": 191, "text": "Независимое государство, существующее параллельно Аду. Управляется Семью Благодетелями, архангелами."}, {"source_paragraph": 193, "text": "Во главе поднебесной стоит Адам – первый человек. Его верными советниками являются 7 архангелов, олицетворяющих добродетели."}, {"source_paragraph": 194, "text": "Архангелы:"}, {"source_paragraph": 195, "text": "Смирение - Уриил. Свет божий. Противопоставлен Гордыне. Полководец небесных воинств."}, {"source_paragraph": 196, "text": "Целомудрие – Рафаил. Исцеление господне. Небесный целитель, хранитель чистоты и непорочности. Противопоставлен Похоти."}, {"source_paragraph": 197, "text": "Милосердие – Гагиил. Крепость господня. Защитник невинных, укротитель ярости. Противопоставлен Гневу."}, {"source_paragraph": 198, "text": "Усердие – Рамиил. Гром божий. Судья, исполнитель воли Адама. Противопоставлен Лени."}, {"source_paragraph": 199, "text": "Справедливость – Сандалфон. Правосудие небес. Верховный судья, взвешивающий души у небесных врат. Противопоставлен Алчности."}, {"source_paragraph": 200, "text": "Воздержание – Ариил. Небесный зверь хранитель. Стражник Небесных врат, хранитель порядка. Противопоставлен Чревоугодию."}, {"source_paragraph": 201, "text": "Братолюбие – Сахакиил. Тень господа. Тайный советник, всевидящий архангел. Противопоставлен Зависти."}, {"source_paragraph": 203, "text": "Сила архангелов зовется благодатью, способна уничтожить демона."}], "illustration": null}, {"id": "entry_10", "title": "Сора", "group": "Персонажи", "kind": "lore", "source_range": [217, 272], "paragraphs": [{"source_paragraph": 217, "text": "Глава II"}, {"source_paragraph": 219, "text": "Сора"}, {"source_paragraph": 220, "text": "“Я подумала его, увидев, вынимая лезвие да из косы. До чего же он в себе уверен я ему еще устрою, этакий сукин сын”"}, {"source_paragraph": 221, "text": "– ВИАГРА – Антигейша"}, {"source_paragraph": 224, "text": "СОРА"}, {"source_paragraph": 233, "text": "1014 лет. Рост 161 см, вес 50 кг."}, {"source_paragraph": 234, "text": "Японский дух кицунэ. 9 хвостов, которые она украла у других кицуне."}, {"source_paragraph": 235, "text": "Знак зодиака: Рыбы"}, {"source_paragraph": 236, "text": "Внешность: рыжие волнистые длинные волосы, настолько красивое лицо, что духи  в свое время строились в очередь, чтобы предложить её отцу сделку и забрать Сору в невесты. Голубые глаза цвета неба перед штормом. Светлая кожа, пухлые розовые губы, острые лисьи зубы, девять лисьих хвостов разного цвета и качества меха и лисьи уши рыжего цвета. Большая грудь и широкие бедра, узкая талия."}, {"source_paragraph": 237, "text": "Стала богиней, но сама об этом ещё не знает."}, {"source_paragraph": 238, "text": "Из древнего клана духов откуда её выгнали за убийство родственника (она не убивала её подставили)"}, {"source_paragraph": 239, "text": "У неё много врагов из-за того что она совершила много плохого."}, {"source_paragraph": 240, "text": "Умеет играть на многих видах азиатских музыкальных инструментов. Умеет танцевать и писать хокку."}, {"source_paragraph": 241, "text": "Носит одежду в стиле древней Японии(в представлении аниме и артов с глубокими вырезами и тд), носит обувь с высокой подошвой чтобы быть выше (тоже традиционная японская обувь)."}, {"source_paragraph": 242, "text": "Всю жизнь училась магии, в ней она ас. но не владеет не одним видом оружия."}, {"source_paragraph": 243, "text": "Хитрая, жестокая, тяжёлый характер, слишком любит роскошь, эгоистка, строга ко всем кроме детей."}, {"source_paragraph": 244, "text": "Те кто знал её раньше не узнают в ней ту кицуне, что была как солнце и была великим целителем."}, {"source_paragraph": 245, "text": "Не восприимчива к алкоголю и наркотикам из-за ядов что пила в детстве и выработала иммунитет."}, {"source_paragraph": 246, "text": "Не понимает свою родную мать которая наложила на себя руки из-за того что император её не любил."}, {"source_paragraph": 247, "text": "Её воспитала императрица, мастерица в ядах, магии и целительстве."}, {"source_paragraph": 248, "text": "Была самой благовоспитанной из своих сестер и братьев по отцовской линии."}, {"source_paragraph": 249, "text": "Праздник очевиден кругом в храмах жгут благовония читают молитвы. Во дворце все служки заняты. Кроме одной - няни Хоши. Но у нее важная миссия."}, {"source_paragraph": 250, "text": "Исполнив ее она исчезает или её заставили."}, {"source_paragraph": 251, "text": "Никто не знает, но факт остается фактом мертвая 5-ая дочь императора на руках у Соры наследницы трона. Она виновата. Руки Соры в крови, а Хоши умерла от отравления. Сора училась у императрицы. Сора обвинена. Её ведут на казнь в этот же день, ведь лисица ничего не рассказала и сама что случилось на том лугу в море кровавых Хиганбан."}, {"source_paragraph": 252, "text": "Казнь – Палачи это ее родственники, с Соры срезают все девять хвостов и отправляют на \"земли воинов\" таких же провинившихся на землях Оми."}, {"source_paragraph": 253, "text": "Агония. И новая жизнь сразу не добра к ней. Земля это существует, чтобы убивать, сражаться и выигрывать или умирать."}, {"source_paragraph": 254, "text": "Ей пришлось стать совсем другой. Наставник (он так и не сказал ей своего имени, чертов старикашка) научил ее хитрости - отрубленные  хвосты других кицуне. что так редки на этих землях, станут ее спасением. И стали. Она научилась убивать, обманывать, жить. Лечение и сострадание больше не её путь."}, {"source_paragraph": 255, "text": "Десять лет в том мире и она ушла. В другой мир. Ад."}], "illustration": null}, {"id": "entry_11", "title": "Лунный Лотос · Глава 1", "group": "Сюжет", "kind": "story", "source_range": [273, 324], "paragraphs": [{"source_paragraph": 273, "text": "«Лунный Лотос»"}, {"source_paragraph": 274, "text": "Глава 1."}, {"source_paragraph": 275, "text": "Холодный воздух задувал под тонкое кимоно, омывая тело ледяными иглами и заставляя внутренности сжиматься от пронизывающей дрожи. Сора потупила взгляд на невысокое, но несомненно помпезное здание, сочетавшее в себе причудливый гламур и архитектуру японских дворцов. Оно пестрело резными колоннами, крошечными садами камней и алыми воротами-тории."}, {"source_paragraph": 276, "text": "Чертовщина какая-то."}, {"source_paragraph": 277, "text": "Еще пару дней назад она была там, где и должна была быть — в родном доме, при дворе отца, упиваясь своей прежней жизнью и её возможностями. Теперь же больше походила на бродяжку, лишь смутно понимающую, где находится. В желудке булькало от голода, тело продрогло до костей, в которых набатом отдавалась застарелая боль от криво сросшихся переломов. Она чувствовала себя потерянной и слегка напуганной, ведь всего несколько часов назад очнулась на грязных улицах этого странного местечка, среди столь же причудливых существ. То зрелище было воистину фантасмагоричным: первым, кто предстал её взору, оказался старичок в засаленной рясе, с мутными глазами и витиеватыми рогами, венчавшими плешивую голову. Картавя и издавая не самые приятные звуки, он, кажется, пытался указать ей дорогу, без умолку бормоча что-то про «владыку». Ступая по мощёным улочкам, она выбралась из грязного захолустья в сияющий аляповатыми красками город, пестрящий несуразно-пошлыми, на её взгляд, плакатами, статуями и прочими атрибутами порока. И в центре всего этого безобразия возвышалось то самое помпезное здание."}, {"source_paragraph": 278, "text": "Сора бросила взгляд на яркую неоновую вывеску на главных воротах и, прищурившись, с удивлением узнала родной язык."}, {"source_paragraph": 279, "text": "— Лунный Лотос, — тихо прочла она, подходя ближе и вглядываясь в крупные буквы. — Публичный дом… — заключила она, насмешливо вздёрнув рыжую бровь."}, {"source_paragraph": 280, "text": "Публичный дом? Это уж точно было последним, чего она могла ожидать в столь странном месте. Но выбора у неё не оставалось, и потому, гордо вздернув голову, Сора шагнула за ворота, направляясь к охране. Два здоровяка в металлической амуниции, смахивающей на доспехи самураев, встретили её хмурыми, подозрительными взглядами из-под покатых лбов. Тот, что покрупнее, топнул копытом, отчего девушка непроизвольно вздрогнула."}, {"source_paragraph": 281, "text": "— Кто такая? — басистый голос твари прокатился по улице, больно ударяя по барабанным перепонкам."}, {"source_paragraph": 282, "text": "— Я пришла к… владыке, — выдохнула Сора, нервно встряхнув ушками и кутаясь в тонкие ткани кимоно. — Мне нужна работа. Кров."}, {"source_paragraph": 283, "text": "Охранник окинул её внимательным, липким взглядом, прежде чем криво усмехнуться и метнуть неоднозначный взгляд напарнику. Недолгая немая пауза прервалась его резким кивком, и Сору пропустили внутрь. Соблюдая видимость приличия, она склонила голову и скользнула к зияющему входу, возвышавшемуся в торце здания."}, {"source_paragraph": 284, "text": "Внутри пахло… чистотой и праздностью. Богатая обстановка производила впечатление, от которого по спине пробегали легкие мурашки. Тяжёлый аромат сандала щекотал ноздри, а тихая, обволакивающая мелодия заставляла немного успокоиться её загнанное сердце. Сора скользила по удивительно расшитым коврам в неизвестном, но, казалось, верном направлении, жадно разглядывая убранство обители. «Бордель? Было бы грубо назвать это место так», — промелькнуло у неё в голове с приятным восторгом: мраморные полы, люстры и портьеры, пестрящие золотом и шёлком, дорогое убранство, подобранное с изысканным вкусом. Она не заметила, как очутилась перед тяжёлой дубовой дверью с витиеватыми узорами. Сглотнув ком в горле, Сора подняла ладонь и постучала, а затем, не дождавшись ответа, просто вошла внутрь."}, {"source_paragraph": 285, "text": "Кабинет, как она поняла, оказался не менее роскошным, но с уютной изюминкой. На полу расстилался меховой ковёр, у стены мирно потрескивал камин. Огромный дубовый стол ломился от фужеров, ваз с фруктами и диковинных угощений, которых Сора никогда не видела, — от одного их вида во рту собралась слюна, напомнив как она голодна. Во главе стола, в огромном бархатном кресле, восседала девушка."}, {"source_paragraph": 286, "text": "Сора смутилась."}, {"source_paragraph": 287, "text": "Незнакомка казалась хрупкой: тонкая, молочного оттенка кожа отражала тёплый оранжевый свет камина и мягко переливалась на волосах, остриженных под каре. Голову венчали аккуратные рожки, а по хрупкой фигурке струилось шёлковое платье цвета топлёного серебра, усыпанное драгоценностями. Девушка подняла на неё огромные глаза янтарного цвета, и Сора кожей ощутила исходящую от этого существа власть."}, {"source_paragraph": 288, "text": "— Здравствуйте… — хрипло пробормотала она, затем откашлялась, стараясь придать голосу уверенности. — Я пришла просить работы, — чётко отчеканила Сора, не решаясь ступить на меховой ковёр."}, {"source_paragraph": 289, "text": "Девушка ухмыльнулась; в её изящных пальцах с острыми коготками появилась длинная трубка, от которой она затянулась с особым, чарующим обаянием."}, {"source_paragraph": 290, "text": "— Работу? — её голос, низкий и бархатистый, звенел неподдельным любопытством. Она качнула хвостом с причудливым кончиком, напоминающим стрелку, и смерила Сору изучающим взглядом. — Ты не из местных, лисица. Таких, как ты, редко заносит к нам северным ветром, — улыбнулась владычица, выдыхая облако розоватого дыма и подпирая подбородок изящной рукой."}, {"source_paragraph": 291, "text": "Сора потупила взгляд, прежде чем кивнуть."}, {"source_paragraph": 292, "text": "— Это так. Не буду лукавить, я не особо понимаю, где нахожусь, кто все эти существа… Всё это мне чуждо, — честно ответила она, встречаясь с заинтересованным взглядом владычицы."}, {"source_paragraph": 293, "text": "Та издала тихий смешок и покачала головой — её, казалось, это забавляло."}, {"source_paragraph": 294, "text": "— Милая моя, ты в Аду, — проворковала девушка, и у Соры перехватило дыхание. — В самом настоящем Аду, поверь. Меня зовут Лиа Асмодей Фаврис. Я — смертный грех похоти, Владычица этого круга. Но это, я думаю, ты уже поняла. — Лиа вновь выдохнула сгусток дыма, наблюдая за ошарашенной реакцией Соры."}, {"source_paragraph": 295, "text": "— Ад… - Сора гулко сглотнула, попробовав слово на языке, словно диковинку, – Меня зовут Сора, госпожа. Мне нужен кров и работа. Я согласна даже на тяжелую, стойкости мне не занимать."}, {"source_paragraph": 296, "text": "Лиа раскрыла глаза ещё шире и залилась хриплым, весёлым смехом, хлопнув себя по коленке."}, {"source_paragraph": 297, "text": "— Ах вот как? И что же ты можешь мне предложить? — Она поднялась с кресла и медленно подошла к Соре. Её рост оказался совсем незначительным — она едва доставала Соре до кончика носа, но стать, сквозившая в каждой линии её тела, говорила сама за себя. — Я управляю борделем, крошка, — улыбнулась она, приближаясь."}, {"source_paragraph": 298, "text": "Сора вздрогнула. Она была согласна на поручения, даже опасные, но оказывать услуги и торговать телом… Сора тряхнула головой, отгоняя внезапный дурман. Лиа тем временем обошла её вокруг, с интересом провела кончиками пальцев по лисьим хвостам, накрутила на палец прядь рыжих волос."}, {"source_paragraph": 299, "text": "— Тощая, в чём душа держится, — констатировала Владычица, останавливаясь перед ней. — Куртизанок и служанок у меня в избытке, дорогуша."}, {"source_paragraph": 300, "text": "— Я могу быть лекарем, целителем, — упрямо вздернув подбородок, продолжала Сора. — Я отлично владею магией целительства, разбираюсь в ядах и зельях, знаю фармацевтику. — Она подняла голубые глаза на Лиа со всей возможной серьёзностью и вновь встретила любопытный, весёлый взгляд."}, {"source_paragraph": 301, "text": "— Фармацевт… Лекарь… Ты интересна, лисица Сора. Право, куртизанка из тебя вышла бы дрянная — слишком уж упрям твой внутренний стержень, — она ткнула острым коготком в грудь Соры, тихо хохотнув. — Однако целитель — это полезно. В нашем мире азарта, гламура и похоти всегда нужно быть начеку. Что ж… Эксперименты это всегда интересно, не так ли? Я принимаю твое предложение."}, {"source_paragraph": 302, "text": "Лиа взмахнула рукой, и кончики её пальцев вспыхнули розовым пламенем, образуя свиток."}, {"source_paragraph": 303, "text": "— Свои обязанности ты знаешь. Кабинет и комнату тебе выделят. Работаешь ежедневно, а я щедро осыплю тебя шиннерами за качественный труд. Идёт?"}, {"source_paragraph": 304, "text": "Сора кивнула, растягивая губы в усталой улыбке."}, {"source_paragraph": 305, "text": "— Да, госпожа."}, {"source_paragraph": 306, "text": "Чиркнув на свитке, она хотела было отдать его Лиа, но та покачала головой, и в её пальцах сверкнувших розовым огоньком появилось острая иголка."}, {"source_paragraph": 307, "text": "— Нет-нет, дорогуша. В Аду контракты заключаются так, — шепнула Лиа, взяла палец Соры, быстрым движением проколола его и, заставив девушку тихо зашипеть от боли, прижала к свитку, оставив кровавый отпечаток. — Добро пожаловать в Ад, лисичка."}, {"source_paragraph": 308, "text": "Небольшой инструктаж прошёл без неожиданностей, Лиа сбавила свое насмешливое любопытство, быстро отчеканив Соре главные пункты ее обязанностей. Соре выдали котомку с одеждой, а старый имп — как она позже узнала название этого тщедушного старичка — проводил её в личные покои. Ей полагалась скромная, но уютная комнатка в крыле для прислуги, где обосновывались служанки, куртизанки и прочие работники борделя. В ней было тепло, посередине стоял котацу с фиолетовой скатертью, а пол устилали мягкие татами. Сора вдохнула полной грудью запах тёплого дерева и каких-то травяных масел, мельком заглянула в маленькую, но чистую ванную с дубовым офуро, прежде чем рухнуть на футон, скинув с себя кимоно. Веки отяжелели от усталости, но в голове царила странная, почти невесомая ясность. Ад… Место, где она не ожидала оказаться ни при одном из вариантов развития событий. И всё же вот она, в публичном доме, у самой Владычицы Похоти. Жизнь здесь обещала стать поистине интересной и Сора наконец провалилась в сон."}, {"source_paragraph": 309, "text": "Утро — если Сора правильно поняла распорядок этого пёстрого мира — встретило её багровым отсветом на стенах. К своему удивлению, она обнаружила, что проснулась от стука в дверь, хотя предпочла бы не вылезать из теплой кровати еще парочку веков. Сонно бормоча проклятия и кутаясь в ватное одеяло, она подбрела к двери и приоткрыла её, недовольно поморщившись от света ламп в коридоре. На пороге стояла служанка в аккуратной форме, вежливо улыбаясь."}, {"source_paragraph": 310, "text": "— Сора, госпожа велела ознакомить тебя с заведением и его обычаями. Я буду ждать в столовой. Не мешкай, — произнесла она и, не дожидаясь ответа, развернулась и исчезла в полумраке коридора."}, {"source_paragraph": 311, "text": "Сора вздохнула так, словно на её плечи свалилась тяжесть в тысячу пудов, и потерла виски. Стараясь не нервировать новых коллег и саму Владычицу, так неожиданно принявшую её под свой кров, она наспех привела себя в порядок: омылась в офуро, собрала длинные рыжие волосы в небрежный пучок и примерила новую униформу — строгое кимоно тёмно-синего цвета, выгодно оттенявшее огненные пряди. Взглянув в зеркало на своё отражение — бледное, но решительное, — Сора выскользнула в коридоры рабочего крыла и вскоре отыскала служанку в столовой. Та назвалась то ли Морой, то ли Марьей, Сора не успела запомнить, лишь приметила ее сверкнувшие наставническим блеском круглые глазки."}, {"source_paragraph": 312, "text": "Девушка тут же потащила её по бесконечным лабиринтам «Лунного Лотоса», спешно, но довольно занятно рассказывая обо всём на свете. Уже через полчаса у Соры голова пошла кругом от обилия информации."}, {"source_paragraph": 313, "text": "Ад, это странное новое место, делился на Семь Кругов, каждым из которых правил один из Смертных Грехов. Круг Похоти, как оказалось, был одним из самых праздных, постоянно соревнуясь в роскоши с кругом Чревоугодия. Из сбивчивых рассказов Сора вычленила кое-что и о местной иерархии. Низшие сословия составляли бесы, импы и грешники; верхами же заправляли демоны, занимавшие ключевые посты в управлении, суде и торговле. На самой вершине пирамиды восседали архидемоны — могущественные правители, управлявшие целыми Кругами, городами и производствами. «Лунный Лотос» же был сердцем их города, его мотором. Сюда, словно мотыльки на огонь, слетались самые знатные демоны — графы, княжны, монополисты и прочая элита, оставляя сотни тысяч шиннеров за ублажения прекрасных куртизанок, сладкие песни, приватные танцы и ослепительных хостов."}, {"source_paragraph": 314, "text": "Именно в этот момент, быстро шагая за своим гидом, Сора свернула за угол и встретилась лбом с внезапно возникшей преградой, едва не отшатнувшись назад и не выругавшись."}, {"source_paragraph": 315, "text": "— Господин Рей! — пискнула служанка, почтительно склонившись, и тут же защебетала что-то слащаво-извиняющееся."}, {"source_paragraph": 316, "text": "Сора наконец подняла голову и почувствовала, как у неё перехватывает дыхание, зрачки непроизвольно расширяются, а лисьи уши прижимаются к голове."}, {"source_paragraph": 317, "text": "Тот, кого назвали «Реем», явно не был ни бесом, ни импом. Соре пришлось задрать голову, чтобы встретиться с цепким взглядом алых глаз. Он был высок, едва не задевая головой дверной косяк. Из густых прядей серебристо-белых волос пробивались крупные, чуткие кошачьи уши, которые Сора с внутренним фырканьем сочла нелепо большими. Его фигура, могучая в плечах и изящно сужающаяся к талии, была облачена в рубашку нежного цвета цветущей сакуры, которая пошло обтягивала торс, открывая перехваченные ремнями мышцы груди. Длинный серебристый хвост плавно покачивался в такт дыханию. Тонкие губы изогнулись в хищной усмешке, обнажая острые клыки. Насмешливый взгляд сверлил её насквозь, заставляя сердце биться чаще — то ли от внезапно вспыхнувшей ярости, то ли от чего-то ещё, пока служанка, испуганно пискнув, не дёрнула Сору за рукав, заставляя склониться в поклоне."}, {"source_paragraph": 318, "text": "— Прошу прощения, господин! Это новенькая, она ещё не знает правил… — голос девушки потонул в бархатном, хриплом смехе, от которого по коже пробежали мурашки."}, {"source_paragraph": 319, "text": "— У новенькой есть имя? Или она равна шавкам, снующим по улицам? — Цепкие пальцы с острыми, лакированными когтями цвета гранита впились в её подбородок, заставляя вновь поднять голову и встретиться взглядом с самодовольным зазнайкой. Его лицо можно было бы изображать на обложках модных журналов, если бы он не оказался таким мудаком, промелькнуло в ее голове мысль и быстро угасла. Сора сглотнула язвительный ком, подкативший к горлу, и растянула губы в оскале."}, {"source_paragraph": 320, "text": "— Меня зовут Сора, господин, — прошипела она, не отводя глаз от его лица."}, {"source_paragraph": 321, "text": "Кажется, её реакция его позабавила ещё больше, ведь служанка рядом испуганно ахнула и прижала ладони ко рту, глядя то на неё, то на высокомерного кота. Пальцы разжались, и демон изящно завёл руку за спину, сделав театральный реверанс."}, {"source_paragraph": 322, "text": "— Лан Рей Ин. Старший сын Владыки и наследник семьи Лан, — прошелестел его бархатный голос, в то время как его вертикальные зрачки, словно в унисон с её собственными, расширились, и в них мелькнула азартная искорка. — Тебе стоит знать, на кого ты работаешь, лисичка. Иначе позориться будешь чаще, чем дышать, — проворковал он, заставляя Сору едва сдерживать дрожь от ярости. «Да кто он такой, этот напыщенный ублюдок?» — пронеслось у неё в голове. Она уже почти представила, как впивается когтями в его шикарную шевелюру и…"}, {"source_paragraph": 323, "text": "— Да, господин, — натянуто ответила она, попытавшись смягчить улыбку, но судя по насмешливому блеску в его глазах, вышло из рук вон плохо."}, {"source_paragraph": 324, "text": "Тот, напоследок горделиво дёрнув хвостом, плавно развернулся и удалился, словно разговор мгновенно перестал его занимать. Сора шумно выдохнула, чувствуя, как ярость всё ещё кипит в ней, словно раскалённая лава. Чёртов кошак! Он вызывал отторжение каждой клеточкой её существа. Сора сделала мысленную пометку, что никогда не смогла бы общаться с таким нафуфыренным павлином, каким был в ее глазах теперь ненавистный Лан Рей Ин."}], "illustration": null}, {"id": "entry_12", "title": "Лунный Лотос · Глава 2", "group": "Сюжет", "kind": "story", "source_range": [325, 362], "paragraphs": [{"source_paragraph": 325, "text": "Глава 2."}, {"source_paragraph": 326, "text": "Немного освоившись с новой должностью Сора порхала по коридорам Лунного Лотоса, раздавая команды своим новым помощникам в лице парочки слуг, которые теперь помогали наводить порядки в ее новом кабинете. В большом уютном помещении расположился дубовый стол, множество полок, которые теперь Сора заполняла разными склянками, колбами со всевозможными отварами и кореньями, причитая, когда чего-то не хватало. В руководство ей так же достался огромный полупустой гримуар, который она могла заполнять тихими вечерами в своих покоях. На званые ужины ее пока выпускать не решались: она все еще плохо справлялась с адским этикетом и дерзкой привычкой скалится и фыркать, когда видела очередного богача перед которым нужно было почтенно склониться, поэтому ее жизнь проходила в рабочем крыле, не прерываясь на «нафуфыренных» павлинов и в целом она была безгранично довольна."}, {"source_paragraph": 327, "text": "Это утро не должно было отличаться от других, по планам было продолжение уборки в ее скромной обители, но как оно бывает по иронии судьбы в Аду, планы полетели к чертям, когда коридоры Лунного Лотоса наполнил душераздирающий переходящий на визг вопль. Сора вынырнула из своей комнаты, вмиг добираясь до раздражающего звука, ожидая увидеть очередную жертву отравления, но замерла на входе в главную гостиную округлив глаза. Сначала она видела только суету слуг, собравшихся возле дивана, затем мимо промелькнул до боли знакомый сереброволосый силуэт, не удосужив ее вниманием."}, {"source_paragraph": 328, "text": "Когда толпа немного расступилась ее взгляду открылось до боли комичное зрелище: на красном бархатном диване развалилась фигура в невозможно коротких шортах, едва прикрывающих задницу и что-то надрывно вопящая про разбитое сердце. Сора приняла бы его за девушку, скользнув взглядом по пышным бедрам и ягодицам, пока не увидела плоскую крепкую мужскую грудь, когда тот развернулся на спину, продолжая свои вопли."}, {"source_paragraph": 329, "text": "-Джун-сама, пожалуйста, успокойтесь!- суетились оставшиеся слуги, под недовольное шипение Рея в другой комнате."}, {"source_paragraph": 330, "text": "Названный Джуном, оказался парнишкой, возрастом схожий с «господином» Реем. По круглому лицу вперемешку с тушью и соплями текли слезы, пока тот с оглушительного визга перешел на тихие причитания. Еще один кот, с неудовольствием приметила Сора, когда тот взмахнул длинным хвостом, и прижал к голове такие же нелепо большие кошачьи уши."}, {"source_paragraph": 331, "text": "-Это конец! Понимаете? Финита ля комедия! Я думал у нас все серьезно! -бормотал надрывно Джун, театрально закатывая глаза цвета солнечного янтаря с вертикальными зрачками и прижимая руку к груди."}, {"source_paragraph": 332, "text": "Сора наконец нашла в себе силы сдвинуться с места и подошла ближе, в нос тут же ударил едкий запах перегара и чего-то кислого, очевидно лужи рвоты поблизости, заставив Сору поморщиться."}, {"source_paragraph": 333, "text": "-Отойдите, принесите чистые полотенца и таз с водой, а еще склянку с надписью «зверобой» - скомандовала она прислуге и тут же опомнившись склонила голову в поклоне, – Господин Джун, позвольте, – она склонилась над ним, рассматривая этот шедевр генетики. Не смотря на непотребный вид, паренек оказался весьма симпатичным, даже с месивом косметики на его приятном лице. Сора могла поклясться, что если это чудо отмыть, то получится даже неплохо. Персиковые спутанные волосы вихрились на его голове закрывая глаза непослушной челкой, совпадая с цветом шерсти на хвосте, вздернутый нос подрагивал когда тот вновь начинал заходиться театральными рыданиями и только тогда Сора заметила что он крепко вцепился в бутылку из под спиртного. Заметив Сору его глаза на секунду прояснились, он с неким интересом разглядывал новое лицо присматриваясь, а затем схватил ее за запястье."}, {"source_paragraph": 334, "text": "-Ох, сестричка, дурно мне! Житься никакого нет от этих толстосумов -протяжно завыл он, когда Сора протестующе попыталась отцепить от себя его ладонь. -Я к ним со всей душой, а они! Козлы, суки!"}, {"source_paragraph": 335, "text": "-Господин, возьмите -Сора наконец скинула с себя его руку и протянула чашку с отваром, которую успела притащить служанка. Джун слегка покривившись взял чашку и сделал пару глотков, снова приложив руку ко лбу."}, {"source_paragraph": 336, "text": "-Я, Джун Лан, такой ослепительный и невероятный и абсолютно никому не нужный! -Вновь завел он шарманку, падая на диван, пока слуги принялись обтирать его мокрыми полотенцами. Его взгляд хитро блеснул, он икнул пытаясь сесть и криво поиграл бровями, – Эй, лисичка, я тебя раньше не видел. Не хочешь утешить несчастного? – фальшиво протянул Джун, прежде чем вновь уткнуться лицом в подушку, затем свеситься с края дивана и проблеваться."}, {"source_paragraph": 337, "text": "Сора отступила на шаг и по ее лицу скользнуло отвращение, прежде чем она скрыла его за маской безразличия, вновь что-то шепнув слугам."}], "illustration": null}, {"id": "entry_13", "title": "Лан Рей Ин", "group": "Персонажи", "kind": "lore", "source_range": [363, 399], "paragraphs": [{"source_paragraph": 363, "text": "Глава II"}, {"source_paragraph": 365, "text": "Рей"}, {"source_paragraph": 366, "text": "«Ах, мальчик-красавчик, сколько девушек вздыхает\nСколько слёз проливают они глядя на тебя\nАх, мальчик-красавчик, сколько девушек страдает\nСколько мимо пролетает, как им плохо без тебя\n\nРодственные связи его на ноги поставят, уже готово кресло, в которое он сядет\nВ будущее глядя через банковскую карту мальчик подрастёт и станет новым олигархом\nНа Гавайях жарко, как от его рассказов, он отбирает топ-моделей для приват-показов\nНадавив на газ на новеньком Ferrari он летит навстречу звёздам не путая педали»."}, {"source_paragraph": 369, "text": "– Елка «Мальчик-красавчик»."}, {"source_paragraph": 370, "text": "ЛАН РЕЙ ИН"}, {"source_paragraph": 371, "text": "1750 лет"}, {"source_paragraph": 372, "text": "Скорпион"}, {"source_paragraph": 373, "text": "Рост 197 сантиметров, вес около 120 килограмм"}, {"source_paragraph": 374, "text": "Серебристые длинные волосы, цвет глаз- красный, кожа светлая. Хвост длинный и не особо пушистый, длинные острые ушки."}, {"source_paragraph": 375, "text": "Родственники: Джун Лан - брат, Кугисаки Лиа - приемная мать."}, {"source_paragraph": 376, "text": "Лиа забрала их с трущоб круга Похоти когда им было около 150 лет( Джун на пару десятков младше Рея). Будучи управляющей Публичного дома забрала их на воспитание. Рей с братом вырос среди работниц борделя, там же научился всему необходимому для жизни. В силу того, что с детства видел грубое отношение демонов к девушкам из ПБ, недолюбливает мужчин. Со своей семьей находится в близких отношениях, иногда гиперопекает брата, остерегаясь что его обидят или сделают ему больно. С матерью любит посидеть вечером и поболтать «по душам», хоть она и не является его родной мамой, Рей ее хорошо понимает и уважает."}, {"source_paragraph": 377, "text": "Работать в ПБ начал когда ему и Джуну было 600 лет. Работа- хост, общение с гостями. Иногда танцует. Гостей завораживает не только его внешний вид, но и поставленная манера речи, приятный голос. Рей достаточно образован, поэтому с интеллигенцией легко находит общий язык."}, {"source_paragraph": 378, "text": "Джун часто называет его занудой или колючкой. Не смотря на теплые отношения друг с другом, они часто ругаются. Рею не нравится, когда его отвлекают, или излишне пристают с разными просьбами. В некоторых случаях может вести себя высокомерно и грубо."}, {"source_paragraph": 379, "text": "Рей известный демон во всех кругах Ада. Стоимость одной встречи с ним превышает 300 тысяч шиннеров, т.е. доступна только для очень обеспеченных демонов."}, {"source_paragraph": 380, "text": "При этом, каким бы высокомерным он не казался, Рей со снисходительностью относится к низшим демонам, импам, бесам, поскольку сам является выходцем трущоб."}, {"source_paragraph": 381, "text": "Рей любит стильную и гламурную одежду, во многом благодаря девушкам из Публичного дома, ему нравятся облегающие и подчеркивающие фигуру наряды, очень любит сочетание розового и серого цвета в одежде."}, {"source_paragraph": 382, "text": "На самом деле очень ранимый, его легко задеть за живое, хотя он этого и не покажет. Не любит когда кто то ворошит его прошлое, или упоминает о происхождении. Интересный факт, что являясь низшим демоном из трущоб он и Джун имеют красивую внешность, тк обычно эти создания весьма уродливы."}, {"source_paragraph": 383, "text": "Лиа ласково называет его и Джуна «котёнком», проявляя материнскую заботу и любовь. Лиа никогда не имела своих детей, поэтому когда в ее жизни появились Джун и Рей она буквально «расцвела», стараясь стать образцовой матерью. Их жизнь всегда была безотказной, после появления в публичном доме, все работницы умилялись еще маленьким братьям, что позволяло им просить все, что они хотят."}], "illustration": null}, {"id": "entry_14", "title": "Лан Кенни", "group": "Персонажи", "kind": "lore", "source_range": [400, 419], "paragraphs": [{"source_paragraph": 400, "text": "Глава III"}, {"source_paragraph": 402, "text": "Кенни"}, {"source_paragraph": 403, "text": "«О, рыжий изумрудный парень\nОн где-то там в листве мелькает\nЛишь краешек улыбки видно\nНе помнишь, сколько выпил яблочного сидра\nС утра до ночи пол второго\nТы падаешь со скейта снова и снова\nFanta и Cola, пластинки Dirol'а\nЧувствуем себя, как будто прогуляли школу»"}, {"source_paragraph": 405, "text": "–Алена Швец «Скейтер»."}, {"source_paragraph": 406, "text": "КЕННИ ЛАН"}, {"source_paragraph": 408, "text": "Возраст ~ 170 лет (12 по человеческим меркам)"}, {"source_paragraph": 409, "text": "Рост ~140см"}, {"source_paragraph": 410, "text": "Является демоном гибридом, из-за смешения крови кицуне и демона-кота."}, {"source_paragraph": 411, "text": "Его внешность микс из генов обоих родителей, рыжая шерсть и волосы, а так же хвост от мамы, красные глаза и кошачьи ушки от папы. В кого характером он пошел, до сих пор не понимают оба. Кенни гиреркативный, до ужаса шумный и любит попадать в неприятности. Именно из-за этого они с Джуном (его дядей) лучшие друзья. Кенни обожает оставаться с Джуном (к сожалению Соры), наряжаться, петь с ним песни и гулять по кругу Похоти, забегая в разные кафе и поедая вредную пищу для бесов, по типу жареных пауков. Они никогда об этом не скажут Рею и Соре. Кенни обожает своих родителей, даже если мама бывает с ним строга. С папой они в близких отношениях, он рассказывает ему секреты, но иногда Сора узнает и за это получают оба. Мечтает когда нибудь попасть к папе на работу, потому что дядя Джун сказал что там очень весело."}, {"source_paragraph": 412, "text": "Любит свою бабушку Лиа (она ненавидит когда ее зовут бабушкой, ведь она молода и красива, но ради первого внука терпит). От нее он получает красивые подарки и теплые разговоры о его чувствах и мыслях, только с Лиа он успокаивается и может спать в ее покоях хоть целый день."}, {"source_paragraph": 413, "text": "Одевает Кенни Сора, но из за влияния дяди и папы он часто ворует вещи из их шкафа надевая из на себя, иногда делает вид что выступает пытаясь пародировать Джуна."}], "illustration": null}, {"id": "entry_15", "title": "Лан Мельгана", "group": "Персонажи", "kind": "lore", "source_range": [420, 463], "paragraphs": [{"source_paragraph": 420, "text": "Глава IV"}, {"source_paragraph": 422, "text": "Мельгана"}, {"source_paragraph": 423, "text": "“You can ask the flowers, I sit for hours,"}, {"source_paragraph": 424, "text": "Tellin' all the bluebirds, The \"bill and coo\" birds,"}, {"source_paragraph": 425, "text": "Pretty little baby,"}, {"source_paragraph": 426, "text": "I'm so in love with you-oo-oo-oo-oo!\""}, {"source_paragraph": 427, "text": "–Connie Francis - Pretty Little Baby"}, {"source_paragraph": 428, "text": "Мельгана"}, {"source_paragraph": 429, "text": "Возраст ~150 (9 по человеческим меркам)"}, {"source_paragraph": 430, "text": "Рост 112см"}, {"source_paragraph": 431, "text": "Сора увидела во сне, как Мельгана умирает  от голода на улицах Лондона времён 19 века, и Сора увидев в ней свою малышку Хоши, забирает её с собой, делая её духом (Это способность Соры как богини)"}, {"source_paragraph": 432, "text": "Внешность Мельганы после перехода: волосы у нее зелёные, цвет такой яркий особенно на солнце. глаза жёлтые словно светятся как неон, особенно в темноте. У неё зелёные кошачьи ушки и хвост."}, {"source_paragraph": 433, "text": "Рей и Сора как бы её удочерили."}, {"source_paragraph": 434, "text": "Характер у нее хочет быть строгой, но непоседливая. Слушает взрослых. Пытается быть очень умной и если ошибается то ей стыдно."}, {"source_paragraph": 435, "text": "Прячется за маминой юбкой. Будет отчитывать сама всех за безумные поступки. немного цундере. Маленкая зануда с тихим голоском. на самом деле очень целеустремлённая."}, {"source_paragraph": 436, "text": "Не заплачет даже если будет очень обидно. Даже если отбирут вкусняшку. Но надует щеки как хомяк."}, {"source_paragraph": 437, "text": "Хочет стать сильной и поэтому выбрала катану!!!"}, {"source_paragraph": 438, "text": "Учиться использовать катану с большим успехом.(её пыталась научить Сора, но она только теоретик сама то не умеет этим пользоваться) Пыталась научится танцевать как Рей или Джун - ну всё получается плохо, но никто ей не говорит об этом."}, {"source_paragraph": 439, "text": "Ещё Мельгана любит читать она и буквы быстро выучила. Мельгану одевает Сора и девочка этому только рада. потому что платье или кимоно с бантами и бубенчиками ей нравятся. Не любит сладкое, но готова есть только кислый мармелад в виде червячков или ведьминых пальцев."}, {"source_paragraph": 440, "text": "Боится незнакомцев. Особенно демониц которое плохо выглядят из-за бедности. Это ей напоминает о маме, которая её бросила бродить по улицам Лондона."}, {"source_paragraph": 441, "text": "Не любит псов. Хочет себе домашнего питомца, но все против им хватает итак забот (Кроме Кенни он тоже хочет питомца, но цели с младшей сестрой у него не совпадают ему нужна как минимум виверна)"}, {"source_paragraph": 442, "text": "Решение завести второго ребенка а точнее взять его, Рей принял с энтузиазмом, по скольку сам является приемным ребенком. Появление в их семье дочки стало для него новым этапом в жизни, если с Кенни он любит пакостить, то к Мельгане относится как к хрустальной вазе, опекая ее от проблем. «Папа порвет тебя, если ты на меня еще раз дыхнешь» - сказала Мельгана бесенку из детского сада."}, {"source_paragraph": 443, "text": "Джун испытывал дикий восторг, когда узнал что у него будет второй соратник по хитростям, но его пыл угас когда он понял что Мельгана слишком тихая и стеснительная для этого, но он все равно любит племянницу, хоть она и не участвует в пакостях, как Кенни. Джун таскает ее на ручках и называет принцессой, любит заплетать ей странные прически."}, {"source_paragraph": 444, "text": "Лиа смирилась что теперь двое зовут ее бабушкой, обожает дарить Мельгане украшения и платья, очень любит ее спокойный характер и что она не дырявит стены ПБ в отличие от некоторых. Сразу приняла ее как родную, разве что носки не вяжет (считает себя слишком молодой для этого). Любит читать Мельгане добрые сказки, пока они сидят у камина в ее покоях."}], "illustration": null}, {"id": "entry_16", "title": "Нойз Лан", "group": "Персонажи", "kind": "lore", "source_range": [464, 490], "paragraphs": [{"source_paragraph": 464, "text": "Нойз Лан"}, {"source_paragraph": 465, "text": "«Идет по магазинам, в\nкошельке кредитная карта\nОн просто обожает Calvin Klein и Prada»"}, {"source_paragraph": 466, "text": "-Женя Ранда «Модная»"}, {"source_paragraph": 470, "text": "Нойз"}, {"source_paragraph": 471, "text": "110 лет (7 по человеческим меркам)"}, {"source_paragraph": 472, "text": "Рост 135 см"}, {"source_paragraph": 473, "text": "Нойз принадлежит к кошачьему виду демонов, как и Рей."}, {"source_paragraph": 474, "text": "Его внешность, в отличие от старшего брата Кенни весьма контрастна с внешностью родителей. У Нойза прямые длинные волосы шоколадного цвета и тонкий хвост с шерстью аналогичного цвета. В отличие от отца и брата его кошачьи ушки маленькие? иногда он их украшает изящными сережками. Нойз и Зефир обладатели светлой кожи? у Нойза под левым глазом маленькая родинка. Глаза Нойза холодного голубого оттенка."}, {"source_paragraph": 475, "text": "Нойз придерживается гламурного шика, его гардероб наполнен шелками, изящными поясами, различными гламурными аксессуарами. Он может часами разглядывать себя в зеркале и примерять наряды, придирчиво фыркая."}, {"source_paragraph": 476, "text": "У Нойза непростой характер, он нарциссичен , уверен в своей полной неотразимости и страдает синдромом «главного героя». Обычно он спокоен и холоден, весьма красноречив и слегка циничен. Весьма тактилен, но только к демонам, которые ему импонируют. Не любит, когда его трогают без разрешения. Говорит медленно, певуче, зачастую может говорить о себе от третьего лица: «Нойз слишком устал.. или - Нойз недоволен вашим внешним видом»."}, {"source_paragraph": 477, "text": "Постоянно носит с собой зеркальце в золотой оправе, проверяя свой внешний вид. Собирает коллекцию парфюмов, подбирая для себя идеальные ароматы. По вечерам записывает в дневник комплименты самому себе «Сегодня Нойз был особо сладкоречив и процитировал книгу Альбора»."}], "illustration": null}, {"id": "entry_17", "title": "Зефир Лан", "group": "Персонажи", "kind": "lore", "source_range": [491, 558], "paragraphs": [{"source_paragraph": 491, "text": "Зефир Лан."}, {"source_paragraph": 493, "text": "«Милое личико, фигурка стройная\nКак обычно укладка, кудри ниже плеч\nне ест сладкое, чтобы талию беречь»"}, {"source_paragraph": 494, "text": "-Женя Ранда «Модная»"}, {"source_paragraph": 496, "text": "Зефир"}, {"source_paragraph": 497, "text": "110 лет (7 по человеческим меркам)"}, {"source_paragraph": 498, "text": "Рост 135 см"}, {"source_paragraph": 499, "text": "Зефир, как и Нойз принадлежит к кошачьему виду демонов, как и Рей."}, {"source_paragraph": 500, "text": "Его внешность схожа с внешностью Нойза, тк они близнецы. У Зефира длинные и кудрявые волосы, шоколадного оттенка, такого же цвета тонкий длинный хвост и маленькие ушки. У Зефира голубые глаза более теплого оттенка, чем у Нойза. ПОд правым глазом родинка."}, {"source_paragraph": 501, "text": "Зефир придерживается гламурного стиля, но выбирает более изящные наряды, банты и галстуки. Ему нравится подчеркивать свое аристократическое происхождение бархатными костюмами жилетками, кожаными изящными сапожками."}, {"source_paragraph": 502, "text": "Зефир брезгливый, любит поворчать он довольно эмоциональный, бывает слишком ранимым.  Он недотрога, глубоко ценящий свой комфорт. Его речь более эмоциональная, с вздохами и закатыванием глаз, порой он слишком драматизирует и может устроить истерику из-за мелочи: «На моем лацкане пятно пыли, Нойз… Это конец..; Опять эти крики, у меня от Кенни начинается мигрень.»"}, {"source_paragraph": 503, "text": "Зефир обожает устраивать чайные церемонии с Нойзом и своими фарфоровыми куклами? иногда снисходя до того, чтобы позвать в компанию Мельгану.  По вечерам составляет «черный список» слишком кричащих нарядов Джуна или выходок Кенни.  Спит с мягкой игрушкой - адский горностай в маленькой серебристой диадеме."}, {"source_paragraph": 506, "text": "Особенности и привычки."}, {"source_paragraph": 508, "text": "Главная особенность Нойза и Зефира - близняшка-чертовка. Это древний адский феномен среди близнецов: они чувствуют друг друга на особом уровне, когда одному плохо - плохо и другому; когда один рад - другой тоже радуется; Они могут понять друг друга без слов, просто посмотрев друг на друга. Но этот феномен особо опасен, если одному из них причинят боль - близнец ощутит это в точности."}, {"source_paragraph": 509, "text": "Они являются одним синхронным организмом, симбиозом двух демонят - договаривают друг за другом, одновременно произносят фразы, совершают движения, иногда даже синхронизируются в мимике или вздохах. Они не могут друг без друга, всегда ходят вместе держась за руки, или обнимаясь. Их категорически запрещено разлучать. Они вместе моются, спят, разве что ходят на разные горшки."}, {"source_paragraph": 510, "text": "Каждое утро начинается с двухчасовой подготовки к выходу: они совместно выбирают сочетающиеся наряды, украшения и прически; распределяют кто какими духами будет пользоваться, чтобы не перебивать ароматы друг друга. Попытка прервать ритуал карается убийственным взглядом."}, {"source_paragraph": 512, "text": "Отношения с семьей."}, {"source_paragraph": 513, "text": "Сора и Рей для них незыблемые идеалы стиля и выдержки; они трепещут перед родителями и не смеют им перечить. Они подражают манерам Рея его походке, речи. С Соры они берут пример того, как себя нужно держать в обществе."}, {"source_paragraph": 515, "text": "Джун (дядя): Стихийное бедствие в обтягивающих шортах. Их реакция на него — коллективное вздрагивание. Они его любят, но их существование — это протокол и эстетика, а Джун — это воплощенный хаос. Их девиз: «Любим на расстоянии, желательно из другой комнаты». Любимая фраза «С кем угодно, только не с дядей!»"}, {"source_paragraph": 516, "text": "· Сцена-изюминка: Джун, пытаясь их развеселить, надевает парик и начинает пародировать Рея. Близнецы сидят, не моргнув, а потом Зефир шепчет Нойзу: «Скажи ему, что он сделал три стилистические ошибки только в прическе». Нойз отвечает: «Он не поймет. Это бесполезно»."}, {"source_paragraph": 518, "text": "Кенни (брат): Несносный проказник. Они относятся к нему, как к милому, но невоспитанному щенку, который норовит испортить им прическу. Общие интересы отсутствуют. Их тактика — избегание. Если Кенни бежит к ним, они принимают защитную стойку, прикрывая хвосты и волосы."}, {"source_paragraph": 520, "text": "Мельгана (сестра): Союзница по несчастью. Они видят в ней родственную душу, такую же жертву хаоса, исходящего от Кенни и Джуна. Хотя они считают ее немного простоватой («Она же выбрала катану, Нойз!»), они ее терпят и даже иногда позволяют ей сидеть с ними, когда те рисуют или играют в тихие игры. Их общий враг сближает."}, {"source_paragraph": 522, "text": "Лия (бабушка): Великая Покровительница Искусств. Они обожают Лию, потому что она — источник самых роскошных подарков и единственный, кто понимает их тягу к прекрасному. Она дарит им не игрушки, а артефакты: миниатюрные сервизы, старинные книги с гравюрами, шелковые ленты. В ее покоях они чувствуют себя в безопасном, блестящем убежище."}], "illustration": null}, {"id": "entry_18", "title": "Джун Лан", "group": "Персонажи", "kind": "lore", "source_range": [559, 633], "paragraphs": [{"source_paragraph": 559, "text": "Глава V"}, {"source_paragraph": 561, "text": "Джун"}, {"source_paragraph": 562, "text": "«В лучах стробоскопа"}, {"source_paragraph": 563, "text": "Ты ловишь мужской силуэт \nСквозь дымку танцпола с улыбкой спокойно\nИдёшь с ним вдвоём в туалет \nДетка, всё предрешено\nТы забудешь эту ночь\nНо запомни лишь одно\nКоролевы пьют вино (а шлюхам всё равно)\n\nКоролева бала короля искал он ночью у бара\nТебе было мало, мало и мало\nБокал за бокалом\nКорону проебал он\n\nВнезапно раздавит свинцовое утро\nВзглядом таксиста отцовским как будто\nПрикроешь колени краем пальто\nОн ещё пожалеет, но вспомнить бы кто»"}, {"source_paragraph": 565, "text": "."}, {"source_paragraph": 566, "text": "– ЛСП «Королева бала»."}, {"source_paragraph": 567, "text": "Джун Лан"}, {"source_paragraph": 569, "text": "Рост 183 см. Теплая светлая кожа, средней длины персиковые волосы.  Длинный хвост и округлые уши. Глаза желтые. Округлые бедра. Ступни напоминают лапы."}, {"source_paragraph": 570, "text": "Кот. Сотрудник публичного дома, певец."}, {"source_paragraph": 571, "text": "Харизматичный, веселый, шумный, немного глуповатый. Пиздатый дядя, Сора его когда нибудь убьет"}, {"source_paragraph": 572, "text": "Джун младший брат Рея. Они росли вместе в трущобах, это время которое с содроганием вспоминают оба."}, {"source_paragraph": 573, "text": "Часто появляется не вовремя, мешая Рею и Соре проводить время вместе, все мы поняли, о чем речь."}, {"source_paragraph": 574, "text": "Любит слушать их перепалки, иногда разговаривая с Реем во время их ссоры на трущобном диалекте и хихикая, за что получает от Соры."}, {"source_paragraph": 575, "text": "Для Соры он выглядит как взрослый ребенок, она иногда раздражена тем, что он не самостоятельный, лезет в их личную жизнь и «портит» им ребенка, но готова терпеть, потому что для Рея брат не менее важен, чем жена и ребенок."}, {"source_paragraph": 576, "text": "Однажды Джун подарил Соре подарок, красивая коробка с золотым бантом, она надеялась на нефритовый чайный сервиз или новое хаори, но открыв его увидела БДСМ набор. Публичный дом два часа слушал ее крики и грохот от побега Джуна с победным смехом."}, {"source_paragraph": 577, "text": "Рей еле доставал до мусорного бака, но залезал в него, пока Джун стоял на шухере. Однажды на них напали бродячие бесы – хотели отобрать заплесневелый хлеб. Рей бросился на них с ржавым гвоздём, прикрывая Джуна спиной. Когда всё кончилось, Джун дрожал, а Рей шёпотом сказал:"}, {"source_paragraph": 578, "text": "— \"Никому не отдам. Ни-ко-му.\""}, {"source_paragraph": 579, "text": "Джун не умел драться – только кусался и царапался, как испуганный котёнок. Рей всегда шёл первым, получая синяки и порезы. Потом Джун мыл его раны в грязной луже, сопел, вытирал кровь грязным рукавом."}, {"source_paragraph": 580, "text": "Рей кричал \"Не ной!\", но позволял ему это – потому что больше некому было о нём заботиться."}, {"source_paragraph": 581, "text": "Когда старшие демоны приходили \"проверить\" трущобы, Рей запихивал джуна в щель между стенами. Сам оставался снаружи, притворяясьмёртвым или огрызаясь, если трогали. Джун зажмуривался, прижимал уши, но слышал, как брату ломают пальцы за отказ отдать последнюю корку. А потом Рей полз к нему, улыбалсяокровавленными зубами:"}, {"source_paragraph": 582, "text": "— \"Всё. Они ушли.\""}, {"source_paragraph": 583, "text": "Холод выл в переулках, а у них не былодаже тряпок, чтобы укрыться."}, {"source_paragraph": 584, "text": "Сам дрожал всю ночь, но не брал ткань обратно."}, {"source_paragraph": 585, "text": "Утром Джун нашёл его синим от холода и лёг сверху, пытаясь согреть – \"Рей, не умирай, не умирай, не умирай...\""}, {"source_paragraph": 586, "text": "Когда лил дождь, они прятались под рваным брезентом."}, {"source_paragraph": 587, "text": "Джун прижимался к Рею, плача от холода."}, {"source_paragraph": 588, "text": "— \"Мы умрём тут?\""}, {"source_paragraph": 589, "text": "Рей стискивал зубы:"}, {"source_paragraph": 590, "text": "— \"Нет. Я тебя не брошу.\""}, {"source_paragraph": 591, "text": "И обещал:"}, {"source_paragraph": 592, "text": "— \"Когда-нибудь у нас будет дом. И еда. И... и всё.\""}, {"source_paragraph": 593, "text": "Джун верил. Потому что Рей никогда не врал."}, {"source_paragraph": 594, "text": "Однажды банда поймала Джуна в тупике."}, {"source_paragraph": 595, "text": "Рей прибежал на крики – и увидел, как его брата бьют ногами."}, {"source_paragraph": 596, "text": "Он не помнил, что было дальне."}, {"source_paragraph": 597, "text": "Только окровавленные кулаки, сломанные зубы на земле и Джун, который обнимал его, шепча:"}, {"source_paragraph": 598, "text": "— \"Хватит, хватит, они уже не дышат...\""}, {"source_paragraph": 599, "text": "Рей впервые испугался самого себя."}, {"source_paragraph": 600, "text": "Она пришла неожиданно – их будущая мать, шёлковая одежда, чистые руки, жёлтые глаза, как у Джуна."}, {"source_paragraph": 601, "text": "Рей зарычал, встал перед братом: \"Уходи!\""}, {"source_paragraph": 602, "text": "Но Лиа не испугалась. Наклонилась, протянула им булку:"}, {"source_paragraph": 603, "text": "— \"Вы голодные?\""}, {"source_paragraph": 604, "text": "Джун потянулся – Рей ударил его по руке."}, {"source_paragraph": 605, "text": "Тогда Лиа вздохнула, достала вторую:"}, {"source_paragraph": 606, "text": "— \"Я не отравлю. Обещаю.\""}, {"source_paragraph": 607, "text": "Они ели, давясь и не веря, а она смотрела на них и плакала."}, {"source_paragraph": 608, "text": "Лиа завернула их в плащ, унесла с собой."}, {"source_paragraph": 609, "text": "В Публичном Доме была ванна, чистая одежда, горячая еда."}, {"source_paragraph": 610, "text": "Рей не ел – сидел и следил, чтобы Джунаникто не тронул."}, {"source_paragraph": 611, "text": "А Джун плакал в тарелку супа, капалсоплями в хлеб:"}, {"source_paragraph": 612, "text": "— \"Рей, это... это не сон?\""}, {"source_paragraph": 613, "text": "Рей не ответил. Только сжал его руку так крепко, что тому было больно."}, {"source_paragraph": 614, "text": "Он вырос изнеженным и избалованным, если в круге Похоти случается проблема, то в 80 процентах случая виноват Джун. Он несносный, шумный и проказливый, обожает подшучивать, за что потом огребает. Благодаря ПБ, его стиль в одежде не менее гламурный, чем у брата. Но Джун больше любит похабщину, развратные рубашки и короткие шорты, едва прикрывающие причинные места. Он огромный фанат самого себя, его ЧСВ не знает границ, однако напиваясь, он чувствует себя одиноко и подавленно."}], "illustration": null}, {"id": "entry_19", "title": "Лиа Фаврис", "group": "Персонажи", "kind": "lore", "source_range": [634, 653], "paragraphs": [{"source_paragraph": 634, "text": "Глава VI"}, {"source_paragraph": 636, "text": "Лия"}, {"source_paragraph": 637, "text": "“Задумывая чёрные дела\nНа небе ухмыляется луна\nА звёзды будто мириады стрел\nЛовя на мушку силуэты снов\nСмеётся и злорадствует любовь\nИ мы с тобой попали на прицел\n\nЯ же своей рукою\nСердце твоё прикрою\nМожешь лететь и не бояться больше ничего\nСердце твоё двулико\nСверху оно набито\nМягкой травой, а снизу каменное, каменное дно”"}, {"source_paragraph": 638, "text": "– Агата Кристи «Черная луна»."}, {"source_paragraph": 639, "text": "ЛИА ФАВРИС"}, {"source_paragraph": 640, "text": "Рост 174 см. Светлая кожа, короткие светлые волосы и бледно желтые глаза. Рога прямые короткие с округлыми концами, хвост и уши заострены."}, {"source_paragraph": 641, "text": "Суккуб. Нынешний правитель круга Похоти. Скверна на высоком уровне, управляет сексуальными и романтическими желаниями."}, {"source_paragraph": 642, "text": "Добрая и открытая, закрытый противник деспотии Люцифера."}, {"source_paragraph": 643, "text": "Лиа родилась в светских кругах в семье поставщика, быстро сблизилась с сыном прежнего главы круга Похоти, Асмодеем. Став достаточно взрослой по меркам Ада, Лиа пришла работать в Публичный дом, управляемый Асмодеем, в этот же период у нее закрутился роман со своим другом дества и управляющим ПБ. Первое время Лиа занималась развлечением гостей, выступая и развлекая их, но ревность Асмодея заставила встать ее на роль второго управляющего Публичного дома. Не смотря на миролюбивый характер, Лиа бывает жесткой, это относится и к работе и к повседневному поведению, может быть слегка высокомерной."}, {"source_paragraph": 644, "text": "Асмодей стал ярым союзником Люцифера, желая объединить силы владык, чтобы Ад стал всемогущим. Лиа не оценила подобный подход, их отношения стали стремительно портиться, некогда веселый и харизматичный возлюбленный стал озлобленным и жестоким, следуя власти Люцифера. После падения кругов Лени и Гордыни, Лиа сразилась с Асмодеем, за право владения кругом Похоти, и одержала победу, заняв его место."}, {"source_paragraph": 645, "text": "Чувство вины и потери гложило молодую правительницу, не помогало общение и любимые развлечения. Спасение она нашла в двух сиротах, обнаруженных на задворках трущоб, неожиданно для себя Лиа испытала сочувствие к малышам, бродящим по улицам и не смогла не забрать их домой, назвав Джуном и Реем. Она расцвела, вновь приобретая уверенность, окружая заботой и любовью не только детей но и свои владения."}], "illustration": null}], "credits": "© 2026 Sorrowitch Ruttigun. Исходный текст предоставлен автором."}</script><script>
const lore=JSON.parse(document.getElementById('data').textContent);const sections=lore.sections;let index=0,spread=0;const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function buildNav(){let h='';for(const group of lore.groups){h+='<div class="group">'+esc(group)+'</div>';sections.forEach((s,i)=>{if(s.group===group)h+='<button class="item" data-i="'+i+'">'+esc(s.title)+'</button>'})}$('nav').innerHTML=h;$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('mobileNav').innerHTML=sections.map((s,i)=>'<option value="'+i+'">'+esc(s.group+' / '+s.title)+'</option>').join('');$('mobileNav').onchange=e=>go(+e.target.value)}function chunks(s){let parts=s.paragraphs.map(p=>'<p>'+esc(p.text)+'</p>');if(s.table){let t='<table>'+s.table.map((row,i)=>'<tr>'+row.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>';parts.push(t)}return parts}function pages(s){const parts=chunks(s);let pages=[],current='',size=0;for(const part of parts){const plain=part.replace(/<[^>]+>/g,'');const n=plain.length; if(size+n>950 && current){pages.push(current);current='';size=0}current+=part;size+=n}if(current)pages.push(current);if(!pages.length)pages=['<div class="empty">Раздел пока пуст</div>'];return pages}function render(){const s=sections[index],p=pages(s);$('sectionName').textContent=s.title;$('leftTitle').textContent=s.title;$('rightTitle').textContent='✦';$('left').innerHTML=p[spread*2]||'<div class="empty">Место для иллюстрации</div>';$('right').innerHTML=p[spread*2+1]||'<div class="empty">Место для иллюстрации</div>';$('counter').textContent=(spread+1)+' / '+Math.ceil(p.length/2);$('mobileNav').value=index;document.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',+b.dataset.i===index))}function go(i){index=i;spread=0;render()}$('next').onclick=()=>{if(spread+1<Math.ceil(pages(sections[index]).length/2))spread++;else if(index+1<sections.length){index++;spread=0}render()};$('prev').onclick=()=>{if(spread>0)spread--;else if(index>0){index--;spread=Math.ceil(pages(sections[index]).length/2)-1}render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});buildNav();render();
</script></body></html>
