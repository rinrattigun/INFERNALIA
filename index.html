
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFERNALIA — Сказания преисподней</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #c7a67b;
  --cream: #f0e6db;
  --muted: #bdaab8;
  --line: #81674f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  background: radial-gradient(
    ellipse at 50% 18%,
    #38263a,
    #1d1520 57%,
    #110d15
  );
  font-family: 'Cormorant Garamond', Georgia, serif;
}

main {
  max-width: 900px;
  margin: auto;
  min-height: 100vh;
  padding: 7vh 20px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.sigil {
  color: var(--gold);
  letter-spacing: 5px;
  font-size: 19px;
}

h1 {
  font: 700 clamp(35px,7vw,75px)
    'Cinzel Decorative', Georgia, serif;
  letter-spacing: 3px;
  margin: 20px 0 6px;
  text-align: center;
  text-shadow: 0 0 30px #c8a37e33;
}

.subtitle {
  font-size: clamp(15px,2.2vw,23px);
  color: #d7c2b5;
  letter-spacing: 3px;
  text-align: center;
}

.rule {
  height: 1px;
  background: linear-gradient(
    90deg, transparent, var(--gold), transparent
  );
  width: min(80%,520px);
  margin: 27px 0;
}

.menu {
  width: min(100%,480px);
  display: grid;
  gap: 12px;
}

.menu a,
.menu button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  width: 100%;
  padding: 13px 20px;
  text-align: center;
  color: var(--cream);
  background: linear-gradient(
    100deg,#251b29,#352638,#251b29
  );
  border: 1px solid var(--line);
  font: 500 25px 'Cormorant Garamond',Georgia,serif;
  text-decoration: none;
  cursor: pointer;
  transition: .2s;
  position: relative;
}

.menu a:hover,
.menu button:hover {
  border-color: #f0d4a3;
  background: #463247;
  box-shadow: 0 0 20px #b68d6244;
}

.menu a:before,
.menu a:after,
.menu button:before,
.menu button:after {
  content: '✦';
  position: absolute;
  color: var(--gold);
  font-size: 11px;
  top: 5px;
}

.menu a:before,
.menu button:before { left: 7px; }

.menu a:after,
.menu button:after { right: 7px; }

.menu .primary { font-size: 29px; }

.footer {
  margin-top: auto;
  padding-top: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  color: var(--muted);
  font-size: 18px;
}

.footer button {
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--line);
  padding: 8px 12px;
  font: inherit;
  cursor: pointer;
}

.footer input {
  accent-color: var(--gold);
  width: 100px;
  vertical-align: middle;
}

#notice {
  min-height: 24px;
  color: #cfb89e;
  text-align: center;
  font-size: 17px;
  margin: 12px;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid #e8c79d;
  outline-offset: 3px;
}

@media(max-width:480px) {
  main { padding-top: 9vh; }
  .subtitle { letter-spacing: 1px; }
  .menu a,.menu button { font-size: 22px; }
}
</style>
</head>

<body>
<main>
  <div class="sigil">✦ ─── ✧ ─── ✦</div>

  <h1>INFERNALIA</h1>

  <div class="subtitle">
    С К А З А Н И Я &nbsp; П Р Е И С П О Д Н Е Й
  </div>

  <div class="rule"></div>

  <nav class="menu" aria-label="Главное меню">
    <a class="primary" href="select/index.html">
      ✧ &nbsp; Новая игра
    </a>

    <button id="continue">
      ◷ &nbsp; Продолжить
    </button>

    <a href="lore/grimoire.html">
      ♧ &nbsp; Лор · Гримуар
    </a>

    <a href="characters/index.html">
      ♙ &nbsp; Галерея персонажей
    </a>

    <button id="playerGallery">
      ◇ &nbsp; Галерея игрока
    </button>
  </nav>

  <div id="notice" role="status"></div>

  <div class="footer">
    <button id="toggleMusic">
      ♫ Включить музыку
    </button>

    <label>
      Громкость
      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="35"
      >
    </label>

    <span>Главная тема · SKWLKR — In Your Night</span>
  </div>

  <audio
    id="bgm"
    src="audio/menu-theme.mp3"
    loop
    preload="metadata"
  ></audio>
</main>

<script>
const bgm = document.getElementById('bgm');
const toggle = document.getElementById('toggleMusic');
const volume = document.getElementById('volume');
const notice = document.getElementById('notice');

bgm.volume = 0.35;
let enabled = false;

function update() {
  toggle.textContent = bgm.paused
    ? '♫ Включить музыку'
    : 'Ⅱ Приостановить музыку';
}

async function play() {
  try {
    await bgm.play();
    enabled = true;
    update();
  } catch (e) {
    notice.textContent =
      'Нажмите «Включить музыку».';
  }
}

toggle.addEventListener('click', () => {
  if (bgm.paused) {
    play();
  } else {
    bgm.pause();
    enabled = false;
    update();
  }
});

volume.addEventListener('input', () => {
  bgm.volume = Number(volume.value) / 100;
});

document.addEventListener('pointerdown', e => {
  if (
    !enabled &&
    !e.target.closest('#toggleMusic') &&
    !e.target.closest('a') &&
    !e.target.closest('button') &&
    !e.target.closest('input')
  ) {
    play();
  }
}, { once: true });

document.getElementById('continue').onclick = () => {
  if (localStorage.getItem('infernalia_demo_save')) {
    location.href = 'story/index.html';
  } else {
    notice.textContent =
      'Сохранений пока нет. Сначала выберите персонажа.';
  }
};

document.getElementById('playerGallery').onclick = () => {
  notice.textContent =
    'Галерея игрока — следующий этап разработки.';
};

update();
</script>
</body>
</html>
