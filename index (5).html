<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выбор истории — INFERNALIA</title><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--gold:#c7a67b;--cream:#f0e6db;--muted:#bdaab8;--line:#81674f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(ellipse at 50% 15%,#3b293e,#1d1520 65%,#100c13);font-family:'Cormorant Garamond',Georgia,serif;font-size:21px}
h1,h2{font-family:'Cinzel Decorative',Georgia,serif}h1{font-size:clamp(27px,4vw,44px);margin:8px 0 4px}h2{font-size:25px}
main{max-width:1140px;margin:auto;padding:25px 22px 55px}.top{text-align:center}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:15px}.muted{color:var(--muted)}a{color:var(--gold)}button{cursor:pointer;font:inherit;color:var(--cream);background:#302331;border:1px solid #94785e;padding:9px 18px}button:hover:not(:disabled),button:focus-visible{border-color:#f1d5a8;background:#49344a;outline:0}button:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;border:1px solid #81674f;padding:7px 15px;margin-bottom:10px}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:17px auto 25px;max-width:700px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.tile{padding:8px;background:#281e2b;border:1px solid #72596a;display:flex;flex-direction:column;gap:7px;align-items:stretch;text-align:center}.tile.active{border-color:#e6c89c;box-shadow:0 0 15px #c8a37e44}.tile img,.tile .blank{width:100%;height:180px;object-fit:cover;object-position:top;background:#1a1420}.tile .blank{display:grid;place-items:center;color:#bdaab8;font-size:35px}.tile span{font-size:18px;line-height:1.1;min-height:40px}.group{margin:25px 0 10px;color:var(--gold);font-size:24px}.detail{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:25px;background:#271d2b;border:1px solid #876d59;padding:20px;margin-top:25px}.detail img,.detail .blank{width:100%;height:350px;object-fit:contain;background:#18131d}.detail .blank{display:grid;place-items:center;color:var(--muted)}.detail h2{margin:4px 0}.detail p{line-height:1.35}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.note{font-size:17px;color:var(--muted)}@media(max-width:640px){.detail{grid-template-columns:1fr}.detail img,.detail .blank{height:280px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><a class="back" href="../index.html">← Главное меню</a><header class="top"><div class="eyebrow">✦ INFERNALIA ✦</div><h1>Выберите свою историю</h1><div class="muted">У каждой души — своя судьба</div></header><div class="rule"></div><div id="list"></div><section id="detail" class="detail" aria-live="polite"></section></main><script>
const characters=[{"id": "char-01", "name": "Сора Лан", "group": "main", "image": "../characters/assets/portrait_15.jpg", "description": "Девятихвостая кицунэ из древнего клана духов. Владеет магией, искусством целительства, игрой на музыкальных инструментах и написанием хокку. Была изгнана из своего клана после ложного обвинения."}, {"id": "char-02", "name": "Лан Рей Ин", "group": "main", "image": "../characters/assets/portrait_02.jpg", "description": "Старший брат Джуна, приёмный сын Лиа. Вырос в трущобах Круга Похоти, позднее стал востребованным хостом «Лунного Лотоса». Образован, обладает приятным голосом, любит гламурную одежду. За внешней надменностью скрывает ранимость."}, {"id": "char-03", "name": "Джун Лан Ин", "group": "main", "image": "../characters/assets/portrait_08.png", "description": "Младший брат Рея, приёмный сын Лиа. Вырос вместе с братом в трущобах Круга Похоти. Шумный, харизматичный и склонный к проделкам; любит сцену, наряды и розыгрыши."}, {"id": "char-04", "name": "Лиа Асмодей Фаврис", "group": "main", "image": "../characters/assets/portrait_01.jpg", "description": "Правительница Круга Похоти. В прошлом работала в публичном доме, которым управлял Асмодей Первантен. Приютила и воспитала братьев Рея и Джуна. Известна любовью к роскоши и заботой о приёмной семье."}, {"id": "char-05", "name": "Кенни Рей Лан", "group": "main", "image": "../characters/assets/portrait_09.png", "description": "Сын Соры и Рея. Унаследовал рыжие волосы и хвост матери, кошачьи уши и красные глаза отца. Очень шумный, энергичный и обожает проказы вместе с дядей Джуном."}, {"id": "char-06", "name": "Лан Мельгана", "group": "main", "image": null, "description": "Приёмная дочь Соры и Рея. Сора спасла её, превратив в духа. У Мельганы зелёные волосы, кошачьи ушки и хвост, светящиеся жёлтые глаза. Тихая, стеснительная и целеустремлённая; любит читать и учится владеть катаной."}, {"id": "char-07", "name": "Нойз Рей Лан", "group": "main", "image": "../characters/assets/portrait_10.png", "description": "Близнец Зефира. Обладатель длинных прямых шоколадных волос и холодных голубых глаз. Любит гламур, изысканные наряды, парфюмерию и безупречный внешний вид. Самоуверен и склонен к нарциссизму."}, {"id": "char-08", "name": "Зефир Рей Лан", "group": "main", "image": "../characters/assets/portrait_10.png", "description": "Близнец Нойза. У него длинные кудрявые шоколадные волосы и голубые глаза более тёплого оттенка. Любит бархатные костюмы, чайные церемонии и безупречный стиль. Эмоционален, брезглив и ценит комфорт."}, {"id": "char-09", "name": "Харуки Хасегава", "group": "other", "image": "../characters/assets/portrait_14.jpg", "description": ""}, {"id": "char-10", "name": "Каин Люцифер Морнингстар Магнум", "group": "other", "image": "../characters/assets/portrait_11.jpg", "description": "Представитель семьи Магнум. В лоре прямо назван архидемоном без скверны: обладает ограниченными демоническими способностями и не имеет магической силы. Титул правителя круга ему не присвоен."}, {"id": "char-11", "name": "Лилит Евангелия Мария Магнум", "group": "other", "image": "../characters/assets/portrait_03.jpg", "description": ""}, {"id": "char-12", "name": "Кассия Люцифер Морнингстар Магнум", "group": "other", "image": "../characters/assets/portrait_13.jpg", "description": ""}, {"id": "char-13", "name": "Мугэ Магнум", "group": "other", "image": null, "description": ""}, {"id": "char-14", "name": "Асмодей Первантен", "group": "other", "image": "../characters/assets/portrait_12.jpg", "description": "Прежний правитель Круга Похоти. В лоре указано, что он пал в битве с Лиа Фаврис."}, {"id": "char-15", "name": "Бритни Иерофант Праудрайд", "group": "other", "image": "../characters/assets/portrait_06.png", "description": "Бывшая правительница Круга Гнева. Её круг пал в битве с верховными."}, {"id": "char-16", "name": "Октавия Аббадон Саднесс", "group": "other", "image": "../characters/assets/portrait_07.png", "description": "Бывшая правительница Круга Лени. В устройстве Ада её круг обозначен как падший."}, {"id": "char-17", "name": "Амайя Бельфего Хантергерия Иггиро", "group": "other", "image": "../characters/assets/portrait_05.png", "description": ""}, {"id": "char-18", "name": "Элаиза Жаннет Дюморье", "group": "other", "image": "../characters/assets/portrait_04.jpg", "description": ""}];
let current=characters[0];
const list=document.getElementById('list'),detail=document.getElementById('detail');
function choose(id){current=characters.find(c=>c.id===id);render();detail.scrollIntoView({behavior:'smooth',block:'nearest'})}
function render(){
list.innerHTML=['main','other'].map(group=>`<h2 class="group">${group==='main'?'Основные персонажи':'Другие персонажи'}</h2><div class="grid">${characters.filter(c=>c.group===group).map(c=>`<button class="tile ${c.id===current.id?'active':''}" data-id="${c.id}">${c.image?`<img src="${c.image}" alt="">`:'<div class="blank">✧</div>'}<span>${c.name}</span></button>`).join('')}</div>`).join('');
list.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.id)));
const desc=document.createElement('p');desc.textContent=current.description||'Описание появится после дополнения лора.';
detail.innerHTML=`${current.image?`<img src="${current.image}" alt="Портрет персонажа">`:'<div class="blank">Портрет будет добавлен</div>'}<div><div class="eyebrow">ВЫБРАННАЯ ИСТОРИЯ</div><h2></h2><div id="desc"></div><p class="note">Сюжетные главы пока не подключены. Можно открыть демонстрационный экран новеллы с выбранным героем.</p><div class="actions"><button id="start">Начать · демо</button><button id="card">Карточка персонажа</button></div></div>`;
detail.querySelector('h2').textContent=current.name;detail.querySelector('#desc').append(desc);
detail.querySelector('#start').onclick=()=>{localStorage.setItem('infernalia_demo_save',JSON.stringify({characterId:current.id,characterName:current.name,startedAt:Date.now()}));location.href='../story/index.html';};
detail.querySelector('#card').onclick=()=>location.href='../characters/index.html';
}
render();
</script></body></html>
