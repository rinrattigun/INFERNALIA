<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создание персонажа — INFERNALIA</title><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#19121d;--panel:#291e2d;--gold:#c7a67b;--cream:#f0e6db;--muted:#bdaab8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 12%,#38283d,#19121d 70%);color:var(--cream);font:21px 'Cormorant Garamond',Georgia,serif}main{max-width:1150px;margin:auto;padding:22px 18px 65px}h1,h2,h3{font-family:'Cinzel Decorative',Georgia,serif}h1{text-align:center;font-size:clamp(25px,4vw,40px);margin:12px 0 4px}.eyebrow{text-align:center;color:var(--gold);letter-spacing:3px;font-size:15px}.sub{text-align:center;color:var(--muted);margin:0 0 24px}.back{display:inline-block;color:var(--gold);text-decoration:none;border:1px solid #856b51;padding:7px 13px}.panel{background:#291e2de8;border:1px solid #96785e;padding:20px;margin:16px 0}.gold{color:var(--gold)}.muted{color:var(--muted)}button,.btn{font:inherit;background:#39283d;border:1px solid #9d805d;color:var(--cream);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.btn:hover{background:#503651;border-color:#e4c395}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{font:inherit;background:#1d1522;border:1px solid #8d715b;color:var(--cream);padding:10px;width:100%;border-radius:0}textarea{resize:vertical}label{display:block;color:var(--gold);margin:13px 0 5px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.tile{background:#291e2d;border:1px solid #755c67;padding:9px;text-align:center;cursor:pointer}.tile.active{border-color:#f1d1a2;box-shadow:0 0 0 1px #f1d1a2}.tile img{height:170px;width:100%;object-fit:cover;object-position:top}.tile span{display:block;margin-top:5px;font-size:17px}.hidden{display:none!important}.frame{border:1px solid #c7a67b;background:#211924;padding:20px;box-shadow:0 0 0 4px #271d2b,0 0 0 5px #795f51}.portrait{width:100%;height:300px;object-fit:contain;background:#1a131e}.fade{animation:appear .42s ease both}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:680px){.portrait{height:230px}.panel{padding:14px}main{padding:14px 12px 40px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style></head><body><main><a class="back" href="../index.html">← Главное меню</a><div class="eyebrow">✦ ЛИЧНОЕ ДОСЬЕ ✦</div><h1>Создать персонажа</h1><p class="sub">Герой, чью судьбу определяете вы</p><div class="panel"><label>Сохранённые персонажи</label><select id="existing"><option value="">Новый персонаж</option></select><div class="actions"><button id="new">Новая анкета</button><button id="delete">Удалить выбранного</button></div><label>Имя *</label><input id="name" maxlength="120" placeholder="Имя персонажа"><label>Раса / происхождение</label><input id="race" placeholder="Человек, демон, грешник или другое"><label>Возраст</label><input id="age" placeholder="Возраст"><label>Внешность</label><textarea id="appearance" rows="3"></textarea><label>Характер</label><textarea id="personality" rows="3"></textarea><label>Биография</label><textarea id="bio" rows="4"></textarea><label>Способности и ограничения</label><textarea id="abilities" rows="3"></textarea><label>Портрет (PNG, JPG, WebP — хранится только в этом браузере)</label><input id="portrait" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" alt="Портрет" style="display:none;max-height:260px;max-width:100%;margin-top:12px"><div class="actions"><button id="save">Сохранить анкету</button><a class="btn" href="../select/index.html">К выбору истории →</a></div><p id="status" class="muted" role="status"></p></div></main><script>const KEY='infernalia_custom_characters';let current=null,portraitData='';const fields=['name','race','age','appearance','personality','bio','abilities'];const $=id=>document.getElementById(id);function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function redraw(){const a=all();$('existing').innerHTML='<option value="">Новый персонаж</option>'+a.map(c=>'<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>').join('');$('existing').value=current||''}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clear(){current=null;portraitData='';fields.forEach(k=>$(k).value='');$('portrait').value='';$('preview').style.display='none';redraw()}function load(id){const c=all().find(x=>x.id===id);if(!c){clear();return}current=id;fields.forEach(k=>$(k).value=c[k]||'');portraitData=c.portrait||'';$('preview').src=portraitData;$('preview').style.display=portraitData?'block':'none';redraw()}$('existing').onchange=e=>load(e.target.value);$('new').onclick=clear;$('delete').onclick=()=>{if(!current)return;if(!confirm('Удалить эту анкету?'))return;localStorage.setItem(KEY,JSON.stringify(all().filter(c=>c.id!==current)));clear()};$('portrait').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1_500_000){$('status').textContent='Файл слишком большой: максимум 1,5 МБ.';return}const reader=new FileReader();reader.onload=()=>{portraitData=reader.result;$('preview').src=portraitData;$('preview').style.display='block'};reader.readAsDataURL(f)};$('save').onclick=()=>{const name=$('name').value.trim();if(!name){$('status').textContent='Введите имя персонажа.';return}const a=all(),id=current||('custom-'+Date.now());const c={id,portrait:portraitData};fields.forEach(k=>c[k]=$(k).value.trim());const ix=a.findIndex(x=>x.id===id);if(ix<0)a.push(c);else a[ix]=c;try{localStorage.setItem(KEY,JSON.stringify(a));current=id;redraw();$('status').textContent='Анкета сохранена в этом браузере.'}catch{$('status').textContent='Не удалось сохранить: переполнено хранилище. Попробуйте меньший портрет.'}};redraw();</script></body></html>
